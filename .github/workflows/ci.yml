name: hub-nozze CI
on:
  push:
    branches: [ "**" ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Esegui le suite native
        working-directory: hub-nozze
        run: node tests/run_all.js
