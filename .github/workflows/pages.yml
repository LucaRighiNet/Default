name: Deploy hub-nozze to GitHub Pages
# Deploy automatico: a ogni push sul branch che tocca hub-nozze/ (o questo
# workflow), l'app viene ripubblicata su GitHub Pages. Il workflow abilita Pages
# da solo (enablement: true) e usa il proprio GITHUB_TOKEN con permessi pages:write,
# quindi non serve alcun intervento manuale. Resta anche il "Run workflow" a mano.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/hub-nozze-handoff-47lbmo
    paths:
      - 'hub-nozze/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub-nozze
      - id: deployment
        uses: actions/deploy-pages@v4
