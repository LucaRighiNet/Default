name: Deploy hub-nozze to GitHub Pages
# Manuale di proposito: pubblicare l'app sul web è una scelta dell'utente.
# Prima abilita Pages (Settings -> Pages -> Source: GitHub Actions), poi lancia
# questo workflow dalla tab Actions ("Run workflow"). Cosi' non ci sono check
# rossi automatici sul PR.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub-nozze
      - id: deployment
        uses: actions/deploy-pages@v4
