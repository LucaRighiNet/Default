<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0E6672"/>
      <stop offset="100%" stop-color="#083840"/>
    </radialGradient>
    <linearGradient id="gold" x1="188" y1="190" x2="356" y2="358" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EED382"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8891F"/>
    </linearGradient>
  </defs>

  <!-- fondo full-bleed (iOS arrotonda da solo; Android maskable maschera) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- fede d'oro: cerchio sotto al 7 -->
  <circle cx="272" cy="274" r="84" fill="none" stroke="url(#gold)" stroke-width="18"/>

  <!-- il 7: barra superiore + diagonale calligrafica, avorio -->
  <path d="M 166 136 H 346 C 322 222 282 314 234 376"
        fill="none" stroke="#F7F3E9" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arco della fede che ripassa SOPRA la diagonale (incrocio basso) -->
  <path d="M 200 330 A 84 84 0 0 0 290 356" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="butt"/>
</svg>
