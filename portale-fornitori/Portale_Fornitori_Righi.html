<style>
/* ===================================================================
   Portale Fornitori Righi Solutions — design system industriale.
   Nessun font/asset esterno, nessuna emoji: icone SVG inline.
   =================================================================== */
:root{
  --bg:#ECEEF4; --surface:#FFFFFF; --surface-2:#F5F6FA; --surface-3:#E8EBF3;
  --ink:#18203A; --ink-soft:#525A72; --muted:#7A8199;
  --brand:#1E2748; --brand-deep:#141B33; --brand-tint:#E8EAF2; --brand-line:#C7CCDE;
  --accent:#E07B27; --accent-deep:#C4661A; --accent-tint:#FCEBDB;
  --line:#DCDFE7; --line-soft:#E9EBF1;
  --ok:#2E7D53; --ok-tint:#E4F1EA;
  --warn:#B4791A; --warn-tint:#F7EEDA;
  --danger:#C0392B; --danger-tint:#F7E4E1;
  --info:#2A6BB0; --info-tint:#E4EEF8;
  --auto:#2B7A78; --dist:#2A6BB0; --pot:#C4661A;
  --shadow:0 1px 2px rgba(16,40,48,.06), 0 6px 20px rgba(16,40,48,.06);
  --shadow-lg:0 12px 40px rgba(8,40,44,.22);
  --r:12px; --r-sm:9px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:var(--bg); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:650;line-height:1.15;letter-spacing:-.01em}
a{color:var(--brand)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.soft{color:var(--ink-soft)}
.center{text-align:center}
.hide{display:none !important}
.svg-ic{width:18px;height:18px;flex:0 0 auto;vertical-align:-3px}
.svg-ic.sm{width:15px;height:15px;vertical-align:-2px}
.svg-ic.lg{width:22px;height:22px}

/* ---- Layout ---- */
#app{min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:40;color:#EAEDF6;
  background:linear-gradient(180deg,#28324f 0%,var(--brand-deep) 100%);
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px);
  display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
.logomark{width:32px;height:32px;flex:0 0 auto;border-radius:8px}
.brand .bt{min-width:0;overflow:hidden}
.brand .bt b{display:block;font-size:14px;font-weight:700;line-height:1.1;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt > span{display:block;font-size:11px;opacity:.72;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.wm{display:inline-flex;gap:.26em;white-space:nowrap;letter-spacing:0;text-transform:none;font-weight:400;font-size:15px}
.wm .r{font-weight:800;font-style:italic}
.wm .s{font-weight:300}
.wm-lg{display:inline-flex;gap:.3em;font-size:29px;letter-spacing:0;line-height:1.05}
.wm-lg .r{font-weight:800;font-style:italic}
.wm-lg .s{font-weight:300}
.tb-spacer{flex:1}
.tb-btn{border:1px solid rgba(234,246,246,.28);background:rgba(234,246,246,.08);color:#EAF6F6;border-radius:10px;min-height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;position:relative}
.tb-btn:hover{background:rgba(234,246,246,.16)}
.tb-btn .badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--brand-deep)}
.role-chip{font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.role-chip.righi{background:var(--accent-tint);color:var(--accent-deep)}
.role-chip.fornitore{background:var(--brand-tint);color:var(--brand-deep)}

nav.tabs{
  position:sticky;top:60px;z-index:35;display:flex;gap:2px;overflow-x:auto;
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:6px calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--ink-soft);padding:8px 13px;border-radius:9px;font-size:13.5px;min-height:40px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
nav.tabs button[aria-selected="true"]{background:var(--brand-tint);color:var(--brand-deep);font-weight:600}
nav.tabs button .cnt{background:var(--surface-3);color:var(--ink-soft);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
nav.tabs button[aria-selected="true"] .cnt{background:#fff;color:var(--brand)}
nav.tabs button .cnt.hot{background:var(--accent);color:#fff}

main{max-width:1180px;margin:0 auto;padding:16px calc(var(--sar) + 14px) calc(var(--sab) + 44px) calc(var(--sal) + 14px)}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px}
.view-head h2{font-size:21px}
.view-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* ---- Cards / grid ---- */
.grid{display:grid;gap:12px}
.grid.k2{grid-template-columns:1fr 1fr}
.grid.k3{grid-template-columns:repeat(3,1fr)}
.grid.k4{grid-template-columns:repeat(4,1fr)}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
/* ---- Cartiglio -------------------------------------------------------------
   L'intestazione dei numeri. NON una fila di riquadri con il numerone: quella e'
   la firma di qualunque cruscotto generato, e dice poco — quattro numeri di pari
   peso, nessuna proporzione, moltissimo spazio verticale.
   Qui si prende in prestito il CARTIGLIO del disegno tecnico: il riquadro che
   Righi ha su ogni tavola. Campi etichettati, righe sottili, numeri a spaziatura
   fissa, niente ombre. In cima una striscia di ripartizione che dice cio' che le
   card non dicevano: come e' distribuito il lavoro, non solo quanto ce n'e'. */
.cartiglio{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-bottom:14px}
/* la striscia porta i numeri dentro i segmenti: cosi' e' una lettura, non un
   ornamento — dice quanto pesa ogni fase, non solo che esiste */
.crt-bar{display:flex;height:23px;background:var(--surface-3);font-size:11px;line-height:1}
.crt-bar .crt-seg{display:flex;align-items:center;justify-content:center;min-width:3px;overflow:hidden;color:#fff;font-weight:600;white-space:nowrap}
.crt-bar .crt-seg > span{padding:0 9px}
.crt-bar .crt-seg .sm{display:none}
@media(max-width:1200px){ .crt-bar .crt-seg .lg{display:none} .crt-bar .crt-seg .sm{display:inline} }
.crt-bar .crt-seg+.crt-seg{border-left:2px solid var(--surface)}
.crt-bar .crt-seg.cf-muted{color:var(--ink-soft)}
.crt-cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
/* i filetti sono ombre di 1px: cosi' restano corretti comunque vada a capo la
   griglia, e i tratti esterni li taglia il bordo del cartiglio */
.crt-cell{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  padding:10px 13px 11px;background:transparent;border:none;color:inherit;font:inherit;
  box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line)}
.crt-cell .k{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);white-space:nowrap}
.crt-cell .k .mk{width:7px;height:7px;border-radius:2px;flex:0 0 auto;background:var(--brand-line)}
.crt-cell .k .mk.cf-ok{background:var(--ok)} .crt-cell .k .mk.cf-warn{background:var(--warn)}
.crt-cell .k .mk.cf-info{background:var(--info)} .crt-cell .k .mk.cf-brand{background:var(--brand)}
.crt-cell .k .mk.cf-accent{background:var(--accent)} .crt-cell .k .mk.cf-danger{background:var(--danger)}
.crt-cell .v{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.crt-cell .s{font-size:11px;color:var(--muted);line-height:1.35;white-space:normal}
button.crt-cell{cursor:pointer;transition:background .12s}
button.crt-cell:hover{background:var(--surface-2)}
button.crt-cell:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.crt-cell.allarme .v{color:var(--danger)}
@media(max-width:560px){
  /* minmax(0,...) e etichetta che va a capo: senza, il testo non spezzabile
     allarga la colonna oltre lo schermo */
  .crt-cells{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crt-cell{padding:9px 11px 10px}
  .crt-cell .k{white-space:normal}
  .crt-cell .v{font-size:22px}
  /* nella striscia resta la sola proporzione: nemmeno il numero ci sta.
     Le cifre sono nelle celle qui sotto. Stessa specificita' della regola
     dei 1200px e definita dopo, cosi' vince davvero. */
  .crt-bar .crt-seg .lg,.crt-bar .crt-seg .sm{display:none}
}
/* metriche fornitore */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mkpi{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:1px}
.mkpi .v{font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mkpi .l{font-size:11px;color:var(--muted)}
.mkpi .s{font-size:10.5px;color:var(--muted)}
.mkpi.ok .v{color:var(--ok)} .mkpi.warn .v{color:var(--warn)} .mkpi.danger .v{color:var(--danger)}
.metric-rows{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.metric-rows > div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spark{display:flex;align-items:flex-end;gap:4px;height:38px;margin-top:12px}
.spark .sbar{flex:1;background:var(--brand-tint);border:1px solid var(--brand-line);border-radius:3px 3px 0 0;min-height:3px}
.spark-x{display:flex;gap:4px;font-size:10px;color:var(--muted);margin-top:2px}
.spark-x span{flex:1;text-align:center;text-transform:uppercase}
@media(max-width:560px){ .mgrid{grid-template-columns:1fr 1fr} }
/* semaforo salute commessa */
.hdot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;flex:0 0 auto}
.hdot.verde{background:var(--ok)} .hdot.giallo{background:var(--warn)} .hdot.rosso{background:var(--danger)}
/* avanzamento a un tocco */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1;min-width:72px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 6px;font-size:12px;text-align:center;color:var(--ink-soft);min-height:auto;position:relative}
.step.done{background:var(--brand-tint);border-color:var(--brand-line);color:var(--brand-deep);font-weight:600}
.step.cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.progress{display:flex;align-items:center;gap:6px;margin:6px 0}
.progress .seg{flex:1;height:6px;border-radius:3px;background:var(--surface-3)}
.progress .seg.on{background:var(--brand)}
/* mappa fornitori (SVG offline) */
.map-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.map-svg{display:block;width:100%;height:auto;background:linear-gradient(160deg,#eaf0f3,#e3eaee)}
.map-svg .pin{cursor:pointer}
.map-svg .pin:hover circle{stroke:var(--ink)}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);padding:10px 2px 0}
.map-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* istogramma carico fornitori (barre di capacità) */
.loadchart{display:flex;flex-direction:column;gap:11px;margin-top:8px}
.loadrow-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:3px}
.loadrow-h b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loadrow-h .ln{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.loadrow-h .st{font-weight:600}
.loadrow-h .st.verde{color:var(--ok)} .loadrow-h .st.giallo{color:var(--warn)} .loadrow-h .st.rosso{color:var(--danger)}
.loadbar{position:relative;height:20px;background:var(--surface-3);border-radius:6px;overflow:hidden;cursor:pointer}
.loadbar .cap{position:absolute;left:0;top:0;bottom:0;background:var(--surface-2)}
.loadbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.loadbar .fill.verde{background:var(--ok)} .loadbar .fill.giallo{background:var(--warn)} .loadbar .fill.rosso{background:var(--danger);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.loadbar .capline{position:absolute;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:var(--ink-soft);z-index:2}
.loadbar:hover .fill{filter:brightness(1.05)}
.load-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.map-legend i.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
.map-legend i.lg.verde{background:var(--ok)} .map-legend i.lg.giallo{background:var(--warn)} .map-legend i.lg.rosso{background:var(--danger);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 2px,transparent 2px 5px)}
/* ---- Toolkit grafici (sezione Analisi) ---- */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.chart-grid{grid-template-columns:1fr}}
.chart-note{color:var(--muted);font-size:12.5px;margin:-2px 0 8px}
.lnk{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
/* firma leggera dell'accettazione */
.firma-box{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:2px 0 12px;font-size:12.5px;line-height:1.45;color:var(--ink-soft);cursor:pointer}
.firma-box input{margin-top:1px;width:18px;height:18px;flex:none;accent-color:var(--brand);cursor:pointer}
.firma-sign{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:600;color:var(--ok)}
.firma-sign .svg-ic{width:14px;height:14px}
/* fornitori suggeriti (auto-matching in pubblicazione) */
.sug-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.sug-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.sug-head b{display:inline-flex;align-items:center;gap:5px}
.sug-head .hint{flex:1;min-width:120px}
.sug-list{display:flex;flex-direction:column;gap:7px}
.sug-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:7px 9px}
.sug-row .gr{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sug-row .gr b{font-size:13px;font-weight:600}
.sug-row .gr .s{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sug-sep{font-size:11.5px;color:var(--muted);text-align:center;margin:10px 0 2px}
/* guida in app */
.guide-sec{margin-top:12px}
.guide-sec-t{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--brand);margin:0 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.faq{padding:8px 2px;border-bottom:1px solid var(--line-soft)}
.faq:last-child{border-bottom:none}
.faq b{display:block;font-size:13px;margin-bottom:2px}
.faq span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.sup-name{cursor:pointer}
.sup-name:hover{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.lrow.row-warn{background:var(--danger-tint);border-radius:8px}
.card.is-off{opacity:.66}
.pref-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pref-grid .pf{font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 7px}
.pref-grid .pf b{color:var(--brand)}
/* token di riempimento (status + brand/info + tipologia); trama su danger per daltonismo/stampa */
.cf-ok{background:var(--ok)} .cf-warn{background:var(--warn)} .cf-info{background:var(--info)} .cf-brand{background:var(--brand)} .cf-muted{background:var(--surface-3)}
.cf-danger{background:var(--danger);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.cf-auto{background:var(--auto)} .cf-dist{background:var(--dist)} .cf-pot{background:var(--pot)}
.cf-accent{background:var(--accent)}
.map-legend i.lg.cf-ok{background:var(--ok)} .map-legend i.lg.cf-warn{background:var(--warn)} .map-legend i.lg.cf-info{background:var(--info)}
.map-legend i.lg.cf-danger{background:var(--danger);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 2px,transparent 2px 5px)}
/* colonne verticali impilate */
.vchart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:18px;border-bottom:1px solid var(--line)}
.vcol-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.vcol{width:100%;max-width:48px;min-height:3px;display:flex;flex-direction:column;border-radius:6px 6px 0 0;overflow:hidden}
.vseg{width:100%;min-height:2px}
.vseg+.vseg{border-top:2px solid var(--surface)}
.vcol-tot{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.vcol-x{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
/* barre orizzontali */
.hchart{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.hrow{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:10px}
.hrow .hlab{font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.htrack{height:18px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.hbar{height:100%;border-radius:6px;min-width:2px}
.hrow .hval{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.hrow.click{cursor:pointer} .hrow.click:hover .hbar{filter:brightness(1.06)} .hrow.click:hover .hlab{color:var(--brand)}
@media(max-width:520px){.hrow{grid-template-columns:96px 1fr auto}}
/* barra impilata singola (salute) */
.stackbar{display:flex;height:28px;border-radius:8px;overflow:hidden;background:var(--surface-3)}
.stackseg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:0}
.stackseg+.stackseg{border-left:2px solid var(--surface)}

/* ---- Pills / badges ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;font-weight:500}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.auto{background:var(--auto)}.dot.dist{background:var(--dist)}.dot.pot{background:var(--pot)}
.pill.ok{background:var(--ok-tint);color:#256844;border-color:#bfe0cd}
.pill.warn{background:var(--warn-tint);color:#7a5410;border-color:#e6d3a6}
.pill.danger{background:var(--danger-tint);color:#932a20;border-color:#eec4bd}
.pill.info{background:var(--info-tint);color:#1e4f85;border-color:#bcd4ee}
.pill.brand{background:var(--brand-tint);color:var(--brand-deep);border-color:var(--brand-line)}
.pill.accent{background:var(--accent-tint);color:var(--accent-deep);border-color:#f0cfac}
.pill.plain{background:var(--surface);border-color:var(--line)}
.pill.lg{font-size:12.5px;padding:5px 11px}
.tags{display:flex;flex-wrap:wrap;gap:5px}

/* ---- Buttons ---- */
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;padding:10px 15px;border-radius:10px;min-height:42px;font-size:14px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s,transform .05s;box-shadow:0 1px 2px rgba(12,90,99,.18)}
.btn:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn:active{transform:translateY(1px)}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--surface);color:var(--danger);border-color:#e6c2bd;box-shadow:none}
.btn.danger:hover{background:var(--danger-tint)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

/* ---- Forms ---- */
.field{margin-bottom:13px}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
select.inp.sm{min-height:34px;padding:5px 8px;font-size:12.5px;width:auto}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:8px 13px;font-size:13px;min-height:40px;display:inline-flex;align-items:center;gap:7px;transition:all .12s;font-weight:500}
.chip:hover{border-color:var(--brand-line)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on .dot{background:#fff}
.chip.on.accent{background:var(--accent);border-color:var(--accent)}
.chip.multi.on{background:var(--brand-tint);border-color:var(--brand-line);color:var(--brand-deep)}
.chip.sugg{border-color:var(--accent);color:var(--accent-deep)}
.chip.multi.on.sugg{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-deep)}
.chip.sm{min-height:34px;padding:6px 11px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:8px 13px;font-size:13px;color:var(--ink-soft);min-height:40px;border-right:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.switch{width:40px;height:23px;border-radius:12px;background:var(--line);border:none;position:relative;cursor:pointer;flex:0 0 auto;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on::after{left:19px}
.toggle-row{display:flex;align-items:center;gap:10px;padding:10px 0}
.toggle-row .gr{flex:1}
.toggle-row .gr b{font-size:13.5px}
.toggle-row .gr span{display:block;font-size:12px;color:var(--muted)}

/* ---- Filter bar ---- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:12px;box-shadow:var(--shadow)}
.searchbox{position:relative;flex:1;min-width:180px}
.searchbox .svg-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:9px;min-height:40px;background:#fff}
.searchbox input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.filt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filt-adv{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filt-adv select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;min-height:38px;background:#fff;font-size:13px;color:var(--ink)}
.filt-active{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:8px;background:var(--brand-tint);color:var(--brand-deep);border:1px solid var(--brand-line)}
.fchip button{border:none;background:none;color:inherit;padding:0;display:flex;cursor:pointer}
.result-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px;font-size:13px;color:var(--muted);flex-wrap:wrap}

/* ---- Table (vista massiva) ---- */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
table.tbl th{background:var(--surface-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;padding:11px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--brand)}
table.tbl th .svg-ic{width:13px;height:13px;opacity:.5;vertical-align:-1px}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tbody tr{cursor:pointer;transition:background .1s}
table.tbl tbody tr:hover{background:var(--brand-tint)}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl .t-title{font-weight:600;color:var(--ink)}
table.tbl .t-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
table.tbl .code{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr.late td{background:linear-gradient(90deg,var(--danger-tint),transparent 30%)}
.morebtn{display:flex;justify-content:center;padding:14px}
/* Lista compatta per la vista massiva su mobile (al posto della tabella larga) */
.jlist{display:flex;flex-direction:column;gap:8px}
.jitem{display:flex;gap:10px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:11px;padding:11px 12px;box-shadow:var(--shadow);text-align:left;width:100%}
.jitem.late{border-left-color:var(--danger)}
.jitem .gr{flex:1;min-width:0}
.jitem .code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.jitem .t{font-weight:600;font-size:14px;margin:1px 0 6px;line-height:1.3}
.jitem .meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.jitem .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap}
.jitem .foot .b{color:var(--ink);font-weight:600}
.jitem .arw{align-self:center;color:var(--muted);display:flex}

/* Board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:9px;min-width:220px}
.col > .h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;padding:2px 2px 0}
.col > .h .n{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px}
.mini{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:10px;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s}
.mini:hover{box-shadow:0 4px 14px rgba(16,40,48,.12)}
.mini.late{border-left-color:var(--danger)}
.mini .t{font-weight:600;font-size:13px;margin:2px 0 6px;line-height:1.3}
.mini .code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.mini .r{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink-soft)}
.col-more{text-align:center;font-size:12.5px;color:var(--brand);font-weight:600;padding:6px;cursor:pointer;border-radius:8px}
.col-more:hover{background:var(--brand-tint)}

/* ---- Job cards ---- */
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.job .body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.job .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job .code{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.job h3{font-size:16px;margin-top:2px}
.job .meta{display:flex;flex-wrap:wrap;gap:5px}
.job .info{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-soft)}
.job .info b{color:var(--ink);font-weight:600}
.job .info .svg-ic{color:var(--muted)}
.job .foot{border-top:1px solid var(--line-soft);padding:10px 14px;display:flex;align-items:center;gap:8px;background:var(--surface-2);flex-wrap:wrap}
.job .foot .btn-row{margin-left:auto}
.leftbar{border-left:4px solid var(--brand)}
.leftbar.pub{border-left-color:var(--info)}
.leftbar.ass{border-left-color:var(--ok)}
.leftbar.late{border-left-color:var(--danger)}
.leftbar.draft{border-left-color:var(--muted)}
.leftbar.done{border-left-color:var(--brand)}

/* list rows */
.rowlist{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-soft);text-align:left}
.lrow:last-child{border-bottom:none}
.lrow .ic{width:36px;height:36px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--brand-tint);color:var(--brand-deep)}
.lrow .ic.accent{background:var(--accent-tint);color:var(--accent-deep)}
.lrow .ic.danger{background:var(--danger-tint);color:var(--danger)}
.lrow .ic.ok{background:var(--ok-tint);color:var(--ok)}
.lrow .ic.info{background:var(--info-tint);color:var(--info)}
.lrow .gr{flex:1;min-width:0}
.lrow .gr b{font-weight:600;font-size:14px}
.lrow .gr .s{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}
.lrow.unread{background:linear-gradient(90deg,var(--accent-tint),transparent 45%)}
.lrow .arw{color:var(--muted);display:flex}
.lrow-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
/* Anagrafica accessi: colonne fisse per profilo e stato, così i campi restano
   incolonnati qualunque sia la lunghezza del nome. */
.acc-row{display:grid;grid-template-columns:26px minmax(0,1fr) 126px 108px;align-items:center;gap:10px;
  padding:9px 2px;border-bottom:1px solid var(--line-soft)}
.acc-row:last-child{border-bottom:none}
.acc-row.off{opacity:.55}
.acc-chi{min-width:0}
.acc-chi b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-chi .s{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-prof,.acc-stato{display:flex;justify-content:flex-start}
.acc-prof .inp.sm{width:100%}
.acc-stato .btn{width:100%}
@media(max-width:560px){
  .acc-row{grid-template-columns:26px minmax(0,1fr);row-gap:7px}
  .acc-prof{grid-column:2}
  .acc-stato{grid-column:2}
}
@media(max-width:640px){
  .lrow:has(.lrow-act){flex-wrap:wrap}
  .lrow .lrow-act{flex-basis:100%;justify-content:flex-start;padding-left:47px}
}
/* Su schermo stretto un pulsante in riga allarga la scheda oltre lo schermo:
   va a capo sotto al testo invece di spingere. */
@media(max-width:560px){
  .lrow:has(> .btn){flex-wrap:wrap}
  .lrow > .btn{flex-basis:100%;margin-left:47px}
}

.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:var(--brand)}
.avatar.sm{width:26px;height:26px;font-size:11px}

/* ---- Empty state ---- */
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .svg-ic{width:34px;height:34px;opacity:.4}
.empty p{margin:8px 0 0}

/* ---- Modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(8,32,36,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
@media(min-width:641px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:580px;border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;box-shadow:var(--shadow-lg);padding:18px calc(var(--sar) + 18px) calc(var(--sab) + 20px) calc(var(--sal) + 18px)}
@media(min-width:641px){.modal{border-radius:16px;max-height:88dvh}}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.modal-h h3{font-size:19px}
.modal-h .x{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:9px;color:var(--ink-soft);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.dl{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
.dl .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.dl .v{font-size:14.5px;font-weight:500}
.divide{height:1px;background:var(--line-soft);margin:14px 0}
.sect-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;display:flex;align-items:center;gap:6px}

/* thread */
.thread{display:flex;flex-direction:column;gap:9px;margin:6px 0}
.msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45}
.msg .who{font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.msg .t{font-size:10.5px;opacity:.55;margin-top:3px;text-align:right}
.msg.them{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.msg.us{align-self:flex-end;background:var(--brand-tint);border:1px solid var(--brand-line)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1}
.toast.ok{background:var(--ok)}
.toast.warn{background:var(--accent-deep)}

/* attach */
.attach{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13px}
.attach .fi{width:30px;height:30px;border-radius:7px;background:var(--brand-tint);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.attach .gr{flex:1;min-width:0}
.attach .gr b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attach .gr span{font-size:11px;color:var(--muted)}
.attach.layout{border-color:var(--accent);background:var(--accent-tint)}
.attach.layout .fi{background:#fff;color:var(--accent-deep)}

/* ---- Login ---- */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1100px 620px at 50% -8%,#2c3860 0,var(--brand-deep) 48%,#0d1122 100%);color:#EAEDF6}
.login .box{width:100%;max-width:452px}
.login .logo{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:20px}
.login .logo .logomark{width:60px;height:60px;border-radius:14px}
.login h1{font-size:22px;letter-spacing:.08em;font-weight:700}

const todayISO = ()=> new Date().toISOString().slice(0,10);
function dISO(off){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+(off||0)); return d.toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date((iso||todayISO())+"T12:00:00"); d.setDate(d.getDate()+(n||0)); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
function fmtDateShort(iso){ if(!iso) return "—"; const [,m,d]=iso.split("-"); return d+"/"+m; }

function daysTo(iso){ if(!iso) return null; const a=new Date(iso+"T12:00:00"), b=new Date(todayISO()+"T12:00:00"); return Math.round((a-b)/86400000); }
function relDays(iso){ const n=daysTo(iso); if(n==null) return ""; if(n===0) return "oggi"; if(n===1) return "domani"; if(n===-1) return "ieri"; return n>0?("tra "+n+" gg"):(Math.abs(n)+" gg fa"); }

/* email compose (mailto) */
function mailto(to, subject, body, cc, bcc){
  const enc=v=>encodeURIComponent(Array.isArray(v)?v.join(","):v).replace(/%2C/g,",");
  const q=[];
  if(cc) q.push("cc="+enc(cc));
  if(bcc) q.push("bcc="+enc(bcc));           // più destinatari in copia nascosta: non si vedono tra loro
  if(subject) q.push("subject="+encodeURIComponent(subject));
  if(body) q.push("body="+encodeURIComponent(body));
  return "mailto:"+(to?enc(to):"")+(q.length?"?"+q.join("&"):"");
}

/* ============================ Storage ============================ */
const KEY="righi_portale_v4", SESSKEY="righi_portale_sess_v4";
// Versione del MODELLO dati. Va alzata quando cambia la forma dei dati: i dati
// salvati con una versione precedente vengono rigenerati dal seed aggiornato,
// altrimenti il browser continuerebbe a mostrare i dati vecchi con il codice nuovo.
const DATA_VERSION = 8;
function makeLocalAdapter(){ return {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
}; }
function makeMemAdapter(){ const m={}; return { get:k=>k in m?m[k]:null, set:(k,v)=>{m[k]=v;} }; }
const Storage = (function(){
  try{ if(typeof window!=="undefined" && window.storage && window.storage.getItem) return {
    get:k=>{ try{return window.storage.getItem(k);}catch(e){return null;} },
    set:(k,v)=>{ try{window.storage.setItem(k,v);}catch(e){} } }; }catch(e){}
  try{ if(typeof localStorage!=="undefined"){ const p="__probe__"; localStorage.setItem(p,"1"); localStorage.removeItem(p); return makeLocalAdapter(); } }catch(e){}
  return makeMemAdapter();
})();
const Store={
  load(){ try{ const r=Storage.get(KEY); if(!r) return null; const o=JSON.parse(r);
    if(!o || o.__v!==DATA_VERSION) return null;         // modello diverso: si riparte dai dati aggiornati
    return o; }catch(e){ return null; } },
  save(state){ try{ if(state) state.__v=DATA_VERSION; Storage.set(KEY, JSON.stringify(state)); }catch(e){} Sync.notify&&Sync.notify(); },
};

/* ============================== Suoni ==============================
   I suoni sono sintetizzati con Web Audio: nessun file audio, il portale resta
   un unico file autonomo e non scarica nulla.

   Le regole che tengono insieme la famiglia (sono quelle che rendono
   riconoscibile un suono di sistema, iPhone o Teams che sia):

   1. UNA SOLA VOCE. Ogni nota e' fondamentale sinusoidale + ottava piu' debole,
      attacco di 6 ms e coda esponenziale. Cambia la melodia, non il timbro:
      cosi' tutti i suoni si riconoscono come "del portale".
   2. UNA SOLA SCALA. Pentatonica di DO (DO RE MI SOL LA): due note qualsiasi di
      questa scala non stonano fra loro, quindi anche due suoni sovrapposti
      (una notifica mentre parte una conferma) restano gradevoli.
   3. LA DIREZIONE E' IL SIGNIFICATO. Ascendente = qualcosa e' andato avanti;
      discendente = qualcosa e' stato negato o bloccato. Si impara senza manuale.
   4. LA DURATA E' IL PESO. 90 ms per un tocco, 250-350 ms per una conferma;
      solo l'assegnazione ha una coda lunga (~0,7 s).
   5. L'ASSEGNAZIONE E' L'EROE. E' il momento per cui esiste il portale: terzina
      ascendente che risolve sull'ottava, con un velo d'aria sotto. Deve dare
      soddisfazione, ed e' l'unico suono che si prende quello spazio.
   6. VOLUMI BASSI. Si lavora in ufficio e in officina: il suono conferma, non
      annuncia. Nessuna voce supera 0,20 di guadagno sul bus.                 */
const SFXKEY="righi_portale_sfx_v1";
const Sfx=(function(){
  const N={C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880.00, C6:1046.50, D6:1174.66, E6:1318.51};
  let ctx=null;            // null = non ancora creato, false = non disponibile
  let bus=null, on=null, last={nome:"", t:-9};

  // Preferenza: si legge alla prima richiesta, non al caricamento (in ambienti
  // senza Storage il try/catch tiene comunque il default "acceso").
  function pref(){ if(on===null){ try{ const v=Storage.get(SFXKEY); on=(v==null)?true:v==="1"; }catch(e){ on=true; } } return on; }

  // Il contesto audio nasce al primo clic dell'utente: i browser non lasciano
  // suonare nulla prima di un gesto, e crearlo qui evita il contesto "sospeso".
  function ac(){
    if(ctx===false) return null;
    if(ctx){ try{ if(ctx.state==="suspended" && ctx.resume) ctx.resume(); }catch(e){} return ctx; }
    try{
      const AC=(typeof window!=="undefined") && (window.AudioContext||window.webkitAudioContext);
      if(!AC){ ctx=false; return null; }
      ctx=new AC();
      bus=ctx.createGain(); bus.gain.value=0.55; bus.connect(ctx.destination);
      return ctx;
    }catch(e){ ctx=false; return null; }
  }

  // Una nota della famiglia: fondamentale + ottava a un quarto del volume.
  // La rampa di 6 ms evita il clic d'attacco, la coda esponenziale evita la coda
  // "tagliata" che fa suonare sintetico un suono altrimenti pulito.
  function nota(t, f, dur, vol, tipo){
    const c=ctx;
    [[1, 1, tipo||"sine"], [2, 0.26, "sine"]].forEach(function(v){
      const o=c.createOscillator(), g=c.createGain();
      o.type=v[2]; o.frequency.setValueAtTime(f*v[0], t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol*v[1]), t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.02);
    });
  }
  // Un soffio d'aria: rumore che sale dentro un passa-banda. Da' corpo agli
  // eventi di "partenza" (pubblicazione, invio) senza aggiungere una nota.
  function soffio(t, dur, f0, f1, vol){
    const c=ctx, n=Math.max(1, Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1, n, c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);   // rumore che si spegne da solo
    const src=c.createBufferSource(); src.buffer=buf;
    const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.1;
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+dur*0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(bp); bp.connect(g); g.connect(bus); src.start(t); src.stop(t+dur);
  }

  /* Il repertorio. Ogni voce e' un evento del portale, non un "suono generico":
     chi lavora tutto il giorno sul portale deve capire cosa e' successo senza
     guardare lo schermo. */
  const SUONI={
    // EROE — commessa assegnata. DO MI SOL che risolve sul DO alto, coda lunga.
    assegnazione(t){ soffio(t, 0.30, 700, 2600, 0.05);
      nota(t,       N.C5, 0.16, 0.16); nota(t+0.075, N.E5, 0.16, 0.17);
      nota(t+0.150, N.G5, 0.20, 0.18); nota(t+0.235, N.C6, 0.70, 0.20); },
    // il fornitore accetta la proposta: due note aperte, ascendenti
    accettazione(t){ nota(t, N.E5, 0.13, 0.16); nota(t+0.085, N.A5, 0.34, 0.17); },
    // approvazione di Righi: quinta breve che sale all'ottava, netta
    approvazione(t){ nota(t, N.G5, 0.11, 0.15); nota(t+0.075, N.C6, 0.32, 0.16); },
    // diniego: stessa quinta ma discendente e con timbro piu' opaco
    rifiuto(t){ nota(t, N.G5, 0.12, 0.13, "triangle"); nota(t+0.090, N.D5, 0.30, 0.13, "triangle"); },
    // qualcosa parte verso i fornitori: soffio in salita e una nota che si stacca
    pubblicazione(t){ soffio(t, 0.22, 500, 3000, 0.055); nota(t+0.06, N.G5, 0.26, 0.14); },
    // fine corsa (consegnato, chiuso): bicordo grave che risolve in alto.
    // Chiude in mezzo secondo: la coda lunga resta un privilegio dell'assegnazione.
    completato(t){ nota(t, N.C5, 0.18, 0.13); nota(t+0.02, N.G5, 0.20, 0.11);
      nota(t+0.120, N.C6, 0.14, 0.15); nota(t+0.190, N.E6, 0.30, 0.16); },
    // passo di lavorazione: due note vicine, come un passo avanti
    avanzamento(t){ nota(t, N.D5, 0.10, 0.13); nota(t+0.070, N.G5, 0.22, 0.14); },
    // c'e' posta per te: campanello acuto in salita
    notifica(t){ nota(t, N.A5, 0.10, 0.14); nota(t+0.100, N.D6, 0.30, 0.15); },
    // messaggio inviato: una sola nota alta, corta
    messaggio(t){ nota(t, N.E6, 0.16, 0.13); },
    // il fornitore chiede qualcosa a Righi: salita ampia, tono interrogativo
    richiesta(t){ nota(t, N.D5, 0.10, 0.13); nota(t+0.075, N.A5, 0.26, 0.14); },
    // email consegnata al client di posta: soffio breve e nota alta
    email(t){ soffio(t, 0.18, 900, 3600, 0.05); nota(t+0.05, N.C6, 0.22, 0.13); },
    // conferma minima per i cambi di stato leggeri
    tocco(t){ nota(t, N.A5, 0.09, 0.09); },
    // azione bloccata: discesa breve e morbida, mai allarmante
    avviso(t){ nota(t, N.D5, 0.10, 0.12, "triangle"); nota(t+0.080, N.C5, 0.26, 0.12, "triangle"); },
  };

  const api={
    get enabled(){ return pref(); },
    nomi(){ return Object.keys(SUONI); },
    set(v){ on=!!v; try{ Storage.set(SFXKEY, on?"1":"0"); }catch(e){} return on; },
    toggle(){ return api.set(!pref()); },
    play(nome){
      if(!pref()) return false;
      const f=SUONI[nome]; if(!f) return false;
      const c=ac(); if(!c) return false;
      const now=c.currentTime;
      if(last.nome===nome && now-last.t<0.09) return false;   // doppio clic: non si somma
      last={nome, t:now};
      try{ f(now+0.012); }catch(e){ return false; }
      return true;
    },
    // L'esito negativo lo suona il toast: ogni azione bloccata avvisa allo stesso
    // modo, senza dover ricordare una chiamata in ogni punto del codice. Se
    // l'azione ha gia' suonato il suo esito (es. "rifiuto"), non si raddoppia.
    esito(kind){
      if(kind!=="warn" || !pref()) return false;
      const c=ac(); if(!c) return false;
      if(c.currentTime-last.t < 0.2) return false;
      return api.play("avviso");
    },
  };
  return api;
})();

/* ===================== Sync seam (RemoteAdapter) =====================
   Contratto dormiente finché non si chiama Sync.enable(remote).
   Il backend reale (vedi BACKEND.md) implementa lo stesso pull()/push(). */
const Sync=(function(){
  let remote=null, base=0, timer=null;
  return {
    enable(r){ remote=r; base=0; },
    async pull(){ if(!remote) return null; const res=await remote.pull(); if(res){ base=res.version; return JSON.parse(res.data); } return null; },
    notify(){ if(!remote) return; clearTimeout(timer); timer=setTimeout(()=>Sync.push(),600); },
    async push(){ if(!remote) return; const res=await remote.push(base, JSON.stringify(STATE)); if(res&&res.ok) base=res.version; return res; },
  };
})();
function makeMemoryRemote(){ let version=0, data=null; return {
  async pull(){ return data==null?null:{version,data}; },
  async push(baseV,payload){ if(baseV!==version) return {conflict:true,version,data}; version++; data=payload; return {ok:true,version}; },
}; }

function docStato(d, meta){

function qualifica(sid){
  const s = supplier(sid); if(!s) return { stato:"non_qualificato", bloccanti:[], mancanti:[], scadenze:[], avvisi:[], righe:[] };
  const righe = docTipiAttivi().map(t => ({ tipo:t.id, meta:t, doc:docOf(s,t.id), stato:docStato(docOf(s,t.id), t) }));
  // solo i tipi obbligatori E bloccanti tolgono l'assegnabilita'
  const bloccanti = righe.filter(r => r.meta.obbl && r.meta.bloccante && DOC_STATI_KO.includes(r.stato));
  // obbligatori non bloccanti che mancano: vanno detti, non fermano il lavoro
  const mancanti  = righe.filter(r => r.meta.obbl && !r.meta.bloccante && DOC_STATI_KO.includes(r.stato));
  // scadenze in arrivo e verifiche pendenti, su qualunque tipo (anche facoltativo)
  const scadenze  = righe.filter(r => ["in_scadenza","in_verifica"].includes(r.stato));
  const avvisi = mancanti.concat(scadenze);
  const stato = bloccanti.length ? "non_qualificato" : (avvisi.length ? "con_riserva" : "qualificato");
  return { stato, bloccanti, mancanti, scadenze, avvisi, righe };
}

  const p = visibili.map(r => r.meta.label + " " + DOC_LABEL[r.stato]);
  if(nascosti) p.push(nascosti + " document" + (nascosti>1?"i":"o") + " gestit" + (nascosti>1?"i":"o") + " da Righi");

// Tutte le righe documento dei fornitori attivi, con i giorni alla scadenza.
function scadenzarioRighe(){
  const out=[];
  STATE.suppliers.filter(s=>s.attivo).forEach(s=>{
    qualifica(s.id).righe.forEach(r=>{
      out.push({ sid:s.id, fornitore:s.name, tipo:r.tipo, meta:r.meta, doc:r.doc, stato:r.stato,
                 giorni: r.doc && r.doc.scadenza ? daysTo(r.doc.scadenza) : null,
                 blocca: !!(r.meta.obbl && r.meta.bloccante) });
    });
  });
  // prima cio' che ferma il lavoro, poi cio' che sta per scadere
  const peso={ scaduto:0, respinto:1, mancante:2, in_verifica:3, in_scadenza:4, valido:5 };
  return out.sort((a,b)=> (peso[a.stato]-peso[b.stato]) || ((b.blocca?1:0)-(a.blocca?1:0))
    || ((a.giorni==null?9999:a.giorni)-(b.giorni==null?9999:b.giorni)) || a.fornitore.localeCompare(b.fornitore));
}

   una riga QUI, non toccare cinque punti diversi e dimenticarne uno.

   Quattro profili distinti, non quattro livelli dello stesso profilo:
   - responsabile di produzione: governa commesse, assegnazioni e anagrafica;
   - caposquadra (OTL): segue le proprie commesse;
   - responsabile QHSE: presidia la PARTE DOCUMENTALE (qualita', sicurezza,
     ambiente). Decide quali documenti servono e quali bloccano, verifica e
     respinge, tiene lo scadenzario. Non pubblica, non assegna, non approva
     commesse: sono mestieri diversi, e tenerli separati e' il senso del profilo.
   - fornitore: vede le proprie commesse e i propri documenti.
   Il responsabile di produzione conserva l'accesso documentale perche' resta il

   e' assente. */

function profiloDi(u){ if(!u) return null;
  if(u.role==="fornitore") return "fornitore";

    const budget=Math.round((3000+rng()*17000)/500)*500;
    const capoId=pick(capi).id;
    const j={ id:"j"+(codeN), code:"RGH-"+(codeN), title:TIPOLOGIE[tip].short+" "+set+" — "+pick(lineTokens),
      tipologia:tip, settore:set, lavorazioni:lavs, ingombro, budget, capoId,
      descrizione:"Cablaggio e cablatura secondo schemi e distinta forniti. Collaudo funzionale prima della consegna.",
      oreStimate:Math.round((20+rng()*360)/5)*5,
      allegati:[{id:uid("a"),name:"Layout_"+slug(set)+"_"+codeN+".pdf",type:"application/pdf",layout:true,size:(300+Math.floor(rng()*500))+" KB"}],
      visibility:"tutti", invitati:[], stato, assegnatoA:null, publishedAt:null, createdAt:dISO(-Math.floor(rng()*60)),
      storicoDate:[], dataRientroEff:null, assegnatoAt:null, avanzamento:null };
    codeN++; Object.assign(j,opts||{});
    // dataConsegna = consegna al cliente (interna Righi). Da questa deriviamo, se non fornite:
    //   rientro in Righi = qualche giorno PRIMA della consegna al cliente (buffer spedizione/installazione)
    //   inizio produzione stimato = alcuni giorni PRIMA del rientro
    if(!j.dataRientro) j.dataRientro=addDays(j.dataConsegna,-(2+Math.floor(rng()*5)));
    if(!j.dataInizioStimata) j.dataInizioStimata=addDays(j.dataRientro,-(6+Math.floor(rng()*16)));
    j.dataRientroBase=j.dataRientro; return j;
  }
  // 40 da assegnare (pubblicati)
  for(let i=0;i<40;i++){ const sel=rng()<0.35; const inv=sel?activeSup.filter(()=>rng()<0.4).map(s=>s.id).slice(0,3):[];
    jobs.push(mk("pubblicato",{ visibility:sel&&inv.length?"selezionati":"tutti", invitati:inv,
      dataRichiesta:dISO(-Math.floor(rng()*8)), dataConsegna:dISO(8+Math.floor(rng()*34)), publishedAt:dISO(-Math.floor(rng()*8)) })); }
  // 150 assegnati / in corso
  for(let i=0;i<150;i++){ const sup=pick(activeSup); const st=rng()<0.5?"assegnato":"in_corso"; const cons=Math.floor(-8+rng()*130);
    jobs.push(mk(st,{ assegnatoA:sup.id, visibility:rng()<0.5?"selezionati":"tutti", invitati:[sup.id],
      dataRichiesta:dISO(-(14+Math.floor(rng()*45))), dataConsegna:dISO(cons), publishedAt:dISO(-(12+Math.floor(rng()*40))),
      assegnatoAt:dISO(-(3+Math.floor(rng()*80))),
      avanzamento: st==="in_corso" ? pick(["materiale","cablaggio","cablaggio","collaudo","pronto"]) : (rng()<0.4?"materiale":null) })); }
  // 22 consegnati (rientro effettivo: mix puntuali/in ritardo rispetto al rientro richiesto -> puntualita)
  for(let i=0;i<22;i++){ const sup=pick(activeSup); const co=-(6+Math.floor(rng()*34)); const onTime=rng()<0.72; const delta=onTime? -Math.floor(rng()*3) : (1+Math.floor(rng()*7));
    const j=mk("consegnato",{ assegnatoA:sup.id, invitati:[sup.id], avanzamento:"pronto",
      dataRichiesta:dISO(co-30-Math.floor(rng()*20)), dataConsegna:dISO(co), publishedAt:dISO(co-28-Math.floor(rng()*10)),
      assegnatoAt:dISO(co-(15+Math.floor(rng()*40))) });
    const eff=addDays(j.dataRientro,delta); j.dataRientroEff = eff<todayISO()?eff:dISO(-1); jobs.push(j); }
  // 6 bozze
  for(let i=0;i<6;i++){ jobs.push(mk("bozza",{ allegati:[], dataRichiesta:dISO(0), dataConsegna:dISO(20+Math.floor(rng()*20)) })); }
  // 4 da approvare (inviate dai capisquadra, in attesa del responsabile di produzione)
  for(let i=0;i<4;i++){ const cu=(i%2===0)?{id:"u_cs1",capoId:"cs1"}:{id:"u_cs2",capoId:"cs2"};
    jobs.push(mk("da_approvare",{ capoId:cu.capoId, richiedente:cu.id, creatoDa:cu.id, approvazione:null, emailNotify:true,
      dataRichiesta:dISO(-Math.floor(rng()*3)), dataConsegna:dISO(15+Math.floor(rng()*30)) })); }

  // Interazioni: accettazioni sui pubblicati + domande + richieste
  const responses=[], requests=[], notifications=[];
  const pubs=jobs.filter(j=>j.stato==="pubblicato");
  pubs.forEach(j=>{ const nAcc=Math.floor(rng()*3); const pool=activeSup.filter(s=> j.visibility==="tutti"||j.invitati.includes(s.id));
    for(let k=0;k<nAcc && k<pool.length;k++){ const s=pool[Math.floor(rng()*pool.length)];
      if(responses.some(r=>r.jobId===j.id&&r.supplierId===s.id)) continue;
      const at=dISO(-Math.floor(rng()*4))+"T09:"+String(15+k*10).padStart(2,"0");
      responses.push({id:uid("r"),jobId:j.id,supplierId:s.id,tipo:"accettazione",testo:"Confermiamo disponibilità.",importo:Math.round(j.budget*(0.92+rng()*0.12)/100)*100,at,from:"fornitore",read:false,firma:{nome:s.name,ts:at}}); }
    if(rng()<0.25){ const s=pool[Math.floor(rng()*pool.length)]; if(s) responses.push({id:uid("r"),jobId:j.id,supplierId:s.id,tipo:"domanda",testo:"La distinta materiali è completa?",at:dISO(-1)+"T11:20",from:"fornitore",read:false}); }
  });
  // richieste guidate su alcune commesse attive
  const active=jobs.filter(j=>j.assegnatoA&&(j.stato==="assegnato"||j.stato==="in_corso"));
  const genTypes=["dubbio","materiale","sopralluogo","collaudo","altro"];
  for(let i=0;i<10;i++){ const j=active[Math.floor(rng()*active.length)]; const tp=pick(genTypes);
    requests.push({id:"qs"+requests.length,jobId:j.id,supplierId:j.assegnatoA,tipo:tp,testo:tp==="materiale"?"Mancano alcuni morsetti sezionabili.":tp==="dubbio"?"Siglatura morsetti non chiara sul foglio 4.":"",at:dISO(-Math.floor(rng()*3))+"T"+(8+i)+":30",stato:i<6?"aperta":"presa",capoId:j.capoId,from:"fornitore",read:i>=6}); }
  // richieste di slittamento aperte (da approvare)
  for(let i=0;i<3;i++){ const j=active[Math.floor(rng()*active.length)]; if(!j) continue;
    requests.push({id:"qs"+requests.length,jobId:j.id,supplierId:j.assegnatoA,tipo:"slittamento",testo:"Ritardo nella fornitura del materiale dal nostro fornitore.",dataProposta:addDays(j.dataRientro,7+Math.floor(rng()*7)),esito:null,at:dISO(-Math.floor(rng()*2))+"T10:1"+i,stato:"aperta",capoId:j.capoId,from:"fornitore",read:false}); }
  // slittamenti già approvati in passato: storico sul RIENTRO (~15% delle commesse attive)
  active.filter(()=>rng()<0.15).forEach(j=>{ const orig=addDays(j.dataRientro,-(5+Math.floor(rng()*8))); j.dataRientroBase=orig;
    j.storicoDate.push({from:orig,to:j.dataRientro,byRole:"caposquadra",by:j.capoId,at:dISO(-(3+Math.floor(rng()*20))),motivo:"Slittamento concordato",tipo:"slittamento"}); });

  // demo: una richiesta con foto allegata + una con risposta rapida già data
  const rMat=requests.find(x=>x.tipo==="materiale"); if(rMat){ rMat.foto=DEMO_FOTO; }
  const rPresa=requests.find(x=>x.stato==="presa"&&x.tipo!=="materiale"); if(rPresa){ rPresa.risposte=[{da:"righi",testo:"Ti richiamo a breve",at:dISO(-1)+"T16:30",byUser:"seed"}]; }

  return {v:4, capi, suppliers, users, jobs, responses, requests, notifications, docTipi:TIPI_DOC};
}

let STATE = Store.load() || seed();
let Session = (function(){ try{ const r=Storage.get(SESSKEY); return r?JSON.parse(r):null; }catch(e){ return null; } })();
let App = { tab:null, lavoriMode:"table", page:1, filters:{q:"",stato:"",tipologia:"",settore:"",capo:"",fornitore:"",late:false}, sort:{key:"rientro",dir:1}, fFilters:{q:"",stato:""} };
const PAGE=40;
/* ---- Grafo esplicito (indici di adiacenza + memoizzazione) ----------------
   Le entità dello STATE formano un grafo: commesse, fornitori, OTL, risposte e
   richieste sono nodi; assegnazioni, inviti e riferimenti sono archi. Invece di
   riscandire le liste ad ogni query (O(n) sparso, render O(n²)), costruiamo le
   liste di adiacenza UNA volta per versione dello stato e le percorriamo.
   Invariante: stessi insiemi e stesso ordine del vecchio codice a scansione. */
let _stateVer = 0;                                   // bumpato ad ogni mutazione persistita
function persist(){ _stateVer++; Store.save(STATE); }
// Riporta la demo ai dati iniziali della versione corrente: utile se il browser
// conserva dati vecchi o se si vuole ripartire puliti dopo aver provato il portale.
function resetDemoData(){ if(!isResp(currentUser())){ toast("Solo il responsabile di produzione","warn"); return; }
  STATE=seed(); Session=null;
  try{ Storage.set(SESSKEY, JSON.stringify(null)); }catch(e){}
  persist(); App.tab=null; App.filters={q:"",stato:"",tipologia:"",settore:"",capo:"",fornitore:"",late:false};
  closeModal(); toast("Dati dimostrativi ripristinati","ok"); render();
}
let _gi=null, _giVer=-1, _giState=null;
function graphIndex(){
  if(_gi && _giVer===_stateVer && _giState===STATE) return _gi;   // valido finché lo stato non cambia
  const jobsBySup={}, invBySup={}, respByJob={}, respBySup={}, reqByJob={}, reqBySup={}, jobById={};
  const push=(m,k,v)=>{ if(k==null) return; (m[k]=m[k]||[]).push(v); };
  for(const j of STATE.jobs){ jobById[j.id]=j; push(jobsBySup, j.assegnatoA, j); if(j.invitati) for(const sid of j.invitati) push(invBySup, sid, j); }
  for(const r of STATE.responses){ push(respByJob, r.jobId, r); push(respBySup, r.supplierId, r); }
  for(const q of STATE.requests){ push(reqByJob, q.jobId, q); push(reqBySup, q.supplierId, q); }
  _gi={jobsBySup, invBySup, respByJob, respBySup, reqByJob, reqBySup, jobById}; _giVer=_stateVer; _giState=STATE; return _gi;
}
let _mCache=new Map(), _mCacheVer=-1, _mCacheState=null;
function metricsCache(){ if(_mCacheVer!==_stateVer || _mCacheState!==STATE){ _mCache.clear(); _mCacheVer=_stateVer; _mCacheState=STATE; } return _mCache; }
function setSession(userId){ Session = userId?{userId}:null; try{ Storage.set(SESSKEY, JSON.stringify(Session)); }catch(e){} }

/* ---- Link diretto (magic link) nelle email ------------------------------------
   Porta il fornitore dentro al portale, gia' identificato, sulla commessa/richiesta
   giusta: un clic dall'email e risponde nel portale (niente password nel prototipo).
   In produzione il link porta un token firmato e a scadenza, verificato lato server
   (vedi BACKEND.md). L'hash viene ripulito subito: nessuna identita' resta nell'URL. */
function portalLink(params){
  const base=(location.href||"").split("#")[0];
  const q=Object.keys(params||{}).filter(k=>params[k]!=null&&params[k]!=="").map(k=>k+"="+encodeURIComponent(params[k]));
  return base+(q.length?"#"+q.join("&"):"");
}
// corpo email standard con invito a rispondere nel portale + link diretto in evidenza
function portalEmailBody(referente, contesto, link){
  return "Buongiorno "+referente+",\n\n"+(contesto?contesto+"\n\n":"")
    +"Puo' accedere al portale e rispondere direttamente qui (un clic, nessuna password):\n"+link
    +"\n\nRighi Solutions — Ufficio Subappalti";
}
// garantisce un accesso fornitore per il fornitore del link (solo alcuni sono pre-creati)
function ensureSupplierUser(sid){ const s=supplier(sid); if(!s) return null;
  let u=STATE.users.find(x=>x.supplierId===sid);
  if(!u){ u={id:"u_link_"+sid, name:s.name, role:"fornitore", supplierId:sid, email:s.email, attivo:true, ruolo:PROFILI.fornitore.ruolo}; STATE.users.push(u); persist(); }
  return u; }
// Notifica in app al fornitore. Consegna GARANTITA: se il fornitore non ha ancora
// un accesso al portale viene creato al volo (prima le notifiche andavano perse).
// Identificativo dell'accesso fornitore SENZA crearlo: si puo' notificare anche chi non
// e' mai entrato nel portale. L'accesso nasce al primo magic link con lo STESSO
// identificativo, quindi le notifiche sono gia' li' ad aspettarlo. (Crearli tutti in
// anticipo riempirebbe di decine di voci la schermata di accesso.)
function supplierUserId(sid){ if(!supplier(sid)) return null;
  const u=STATE.users.find(x=>x.supplierId===sid); return u?u.id:("u_link_"+sid); }
function notifySupplier(sid, o){ const to=supplierUserId(sid); if(!to) return null;
  const n={id:uid("n"),toUser:to,ic:o.ic||"bell",txt:o.txt,sub:o.sub||"",jobId:o.jobId||null,at:new Date().toISOString().slice(0,16),read:false};
  STATE.notifications.push(n); return n; }
// Notifica il caposquadra di riferimento della commessa (avvio produzione, consegna...)
function notifyCapoJob(j, txt, ic){ const cu=STATE.users.find(x=>isCapo(x)&&x.capoId===j.capoId); if(!cu) return null;
  const n={id:uid("n"),toUser:cu.id,ic:ic||"bell",txt,sub:j.code+" — "+j.title,jobId:j.id,at:new Date().toISOString().slice(0,16),read:false};
  STATE.notifications.push(n); return n; }
// Email di avviso al fornitore su una richiesta, col link diretto alla richiesta stessa:
// chi vive nella posta riceve la risposta e ci clicca sopra per rispondere nel portale.
function reqReplyEmail(r, testo, titolo){
  const s=supplier(r.supplierId); if(!s||!s.email) return null;
  const j=byId(STATE.jobs,r.jobId); const tp=REQ_TYPES[r.tipo]||{label:"Richiesta"};
  const contesto=(titolo||"Abbiamo risposto alla sua segnalazione")+" ("+tp.label+")"
    +(j?" sulla commessa "+j.code+" — "+j.title:"")+":\n\n\""+testo+"\"";
  return { to:s.email,
    subject:"["+(j?j.code:"")+"] "+tp.label+" · risposta da Righi",
    body:portalEmailBody(s.referente||s.name, contesto, portalLink({f:s.id,q:r.id,c:(j?j.code:null)})) };
}
// L'avviso via email al fornitore e' attivo per impostazione predefinita (si puo' spegnere per singola risposta)
const wantReplyEmail = ()=> App.replyEmail!==false;
// Invio AUTOMATICO dell'avviso: non apre il modale "Prepara email", consegna
// direttamente al programma di posta gia' compilato (destinatario, oggetto, testo e link).
// In produzione questo passaggio sparisce del tutto: invia il server (vedi BACKEND.md).
function sendEmailNow(em){
  if(!em||!em.to) return false;
  App._email=em; App._lastSent={to:em.to, subject:em.subject, at:new Date().toISOString().slice(0,16)};
  try{ const a=document.createElement("a"); a.href=mailto(em.to,em.subject,em.body); a.target="_blank"; a.rel="noopener";
       a.style.display="none"; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),0); }catch(e){ return false; }
  return true;
}
// al boot: se l'URL ha #f=<fornitore>&c=<commessa> (o &q=<richiesta>), autentica e memorizza il target.
// Ritorna true se il link ha cambiato la sessione o fissato un target (serve per ri-renderizzare).
function resolveMagicLink(){
  const h=(location.hash||"").replace(/^#/,""); if(!h) return false;
  const p={}; h.split("&").forEach(kv=>{ const i=kv.indexOf("="); const k=i<0?kv:kv.slice(0,i), v=i<0?"":kv.slice(i+1); if(k){ try{ p[decodeURIComponent(k)]=decodeURIComponent(v); }catch(e){ p[k]=v; } } });
  if(!(p.f||p.u||p.c||p.q)) return false;   // hash non nostro (es. anchor): non tocchiamo la sessione
  try{ history.replaceState(null,"",(location.href||"").split("#")[0]); }catch(e){ try{ location.hash=""; }catch(_){} }
  if(p.c||p.q) App._deepLink={ code:p.c||null, req:p.q||null };
  // il link personale vince SEMPRE sulla sessione in corso: chi apre l'email deve entrare come se stesso
  // un accesso revocato non rientra dal link: il collegamento identifica, non riapre una porta chiusa
  const entra=u=>{ if(!utenteAttivo(u)){ toast("Accesso disattivato: contatta il responsabile","warn"); return false; }
    setSession(u.id); return true; };
  if(p.f){ const u=ensureSupplierUser(p.f); if(u){ if(entra(u)) return true; return !!App._deepLink; }
    toast("Link non valido: fornitore non trovato","warn"); return !!App._deepLink; }
  if(p.u){ const u=byId(STATE.users,p.u);                                    // link personale di un utente Righi
    if(u){ if(entra(u)) return true; return !!App._deepLink; } }
  return !!App._deepLink;
}
// L'hash puo' arrivare DOPO il boot (alcuni host impostano l'URL dell'iframe dopo il caricamento):
// in quel caso rileggiamo il link, ri-renderizziamo con la nuova identita' e apriamo il target.
function onMagicHash(){ if(resolveMagicLink()){ render(); openDeepLinkTarget(); } }
// dopo il render iniziale (o dopo login manuale col link generico): apre la commessa/richiesta del link
// Il link apre SOLO cio' che l'utente ha diritto di vedere: un codice commessa
// non e' una password, quindi va sempre verificato il permesso (un fornitore non
// deve poter aprire la commessa di un altro nemmeno conoscendone il codice).
function canSeeJob(u, j){ if(!u||!j) return false;
  if(u.role!=="fornitore") return scopedJobs().some(x=>x.id===j.id);      // Righi: rispetta lo scope del caposquadra
  return jobsForSupplier(u.supplierId).some(x=>x.id===j.id); }
function canSeeReq(u, r){ if(!u||!r) return false;
  if(u.role!=="fornitore") return scopedRequests().some(x=>x.id===r.id);
  return r.supplierId===u.supplierId; }
function openDeepLinkTarget(){ const d=App._deepLink; const u=currentUser(); if(!d||!u) return; App._deepLink=null;
  if(d.req){ const r=byId(STATE.requests,d.req);
    if(r && canSeeReq(u,r)){ App.tab="richieste"; render(); openReqDetail(r.id); return; }
    if(r){ toast("Questa richiesta non e' visibile con il tuo accesso","warn"); return; } }
  if(d.code){ const j=STATE.jobs.find(x=>x.code===d.code);
    if(j && canSeeJob(u,j)){
      App.tab = u.role!=="fornitore" ? "lavori" : (j.assegnatoA===u.supplierId ? "miei" : "bacheca");
      render(); openJobModal(j.id); return; }
    if(j) toast("Questa commessa non e' visibile con il tuo accesso","warn"); }
}

const byId = (arr,id)=> arr.find(x=>x.id===id);
const supplier = id => byId(STATE.suppliers,id);
const capo = id => byId(STATE.capi,id);
const currentUser = ()=> Session ? byId(STATE.users, Session.userId) : null;
function jobsForSupplier(sid){ return STATE.jobs.filter(j=>{
  if(j.stato==="bozza" || j.stato==="da_approvare") return false;  // bozze e commesse da approvare non escono mai
  if(j.assegnatoA) return j.assegnatoA===sid;               // assegnato: solo l'assegnatario lo vede
  return j.visibility==="tutti" || (j.invitati||[]).includes(sid); // non ancora assegnato: per visibilità
}); }
// Alert basati sulle date operative del fornitore (mai sulla consegna al cliente):
//  - inizio in ritardo: assegnata ma la produzione non è ancora partita oltre la data di inizio stimata
//  - rientro in ritardo: commessa attiva non ancora rientrata oltre la data di rientro richiesta
function isLateStart(j){ if(j.stato!=="assegnato") return false; const n=daysTo(j.dataInizioStimata); return n!=null && n<0; }
function isLateReturn(j){ if(!["assegnato","in_corso"].includes(j.stato)) return false; const n=daysTo(j.dataRientro); return n!=null && n<0; }
function isLate(j){ return isLateStart(j) || isLateReturn(j); }
// data operativa di riferimento (scadenza fornitore) e giorni di ritardo sul vincolo attivo
function keyDate(j){ return j.dataRientro||j.dataConsegna; }
function lateDays(j){ if(isLateReturn(j)) return Math.abs(daysTo(j.dataRientro)); if(isLateStart(j)) return Math.abs(daysTo(j.dataInizioStimata)); return 0; }
function jobResponses(jid){ return graphIndex().respByJob[jid]||[]; }   // lista di adiacenza commessa-risposte
function jobRequests(jid){ return graphIndex().reqByJob[jid]||[]; }     // lista di adiacenza commessa-richieste
/* Il perimetro sulle commesse sta QUI, alla fonte: il caposquadra vede le
   proprie, il QHSE nessuna (la sua materia sono i documenti). Cosi' anche
   canSeeJob/canSeeReq — e quindi i link diretti — ne discendono senza dover
   ricordare un controllo in piu' in ogni punto. */
function scopedJobs(){ const u=currentUser(); if(isQhse(u)) return [];
  return isCapo(u)? STATE.jobs.filter(j=>j.capoId===u.capoId) : STATE.jobs; }
function scopedRequests(){ const u=currentUser(); if(isQhse(u)) return [];
  return isCapo(u)? STATE.requests.filter(r=>r.capoId===u.capoId) : STATE.requests; }
/* ore stimate: carico attivo per fornitore e mese di consegna (solo dati Righi) */
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function monthKey(iso){ return (iso||"").slice(0,7); }
function monthLabel(k){ if(!k) return "—"; const p=k.split("-"); return MESI[(+p[1])-1]+" '"+p[0].slice(2); }
function activeHours(sid){ return (graphIndex().jobsBySup[sid]||[]).filter(j=>["assegnato","in_corso"].includes(j.stato)).reduce((s,j)=>s+jobOre(j),0); }
function supplierMonthlyLoad(){ const map={}, months=new Set();
  STATE.jobs.filter(j=>["assegnato","in_corso"].includes(j.stato)&&j.assegnatoA).forEach(j=>{ const k=monthKey(j.dataRientro); map[j.assegnatoA]=map[j.assegnatoA]||{}; map[j.assegnatoA][k]=(map[j.assegnatoA][k]||0)+jobOre(j); months.add(k); });
  return {map, months:[...months].sort()}; }
// carico e capacità per mese di RIENTRO (scadenza operativa del fornitore)
function monthLoad(sid, mk){ return (graphIndex().jobsBySup[sid]||[]).filter(j=>["assegnato","in_corso"].includes(j.stato)&&monthKey(j.dataRientro)===mk).reduce((s,j)=>s+jobOre(j),0); }
function freeCapacity(sid, mk){ const s=supplier(sid); if(!s) return 0; mk=mk||monthKey(todayISO()); return (s.capacitaMese||0) - monthLoad(sid, mk); }
function loadRatio(sid, mk){ const s=supplier(sid); if(!s||!s.capacitaMese) return 1; mk=mk||monthKey(todayISO()); return monthLoad(sid, mk)/s.capacitaMese; }
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }
// Metriche fornitore (calcolate, non memorizzate) — identiche lato Righi e lato fornitore
// importo di una commessa per il fornitore: importo accettato, altrimenti budget
// importo concordato all'accettazione (senza extra); se non c'e' accettazione vale il budget
function jobImportoBase(j){ if(!j) return 0; const acc=(graphIndex().respByJob[j.id]||[]).find(r=>r.supplierId===j.assegnatoA&&r.tipo==="accettazione"); return (acc&&acc.importo)||j.budget||0; }
/* ---- Extra: lavorazioni in piu' rispetto all'accordo -------------------------
   Nascono come richiesta guidata del fornitore, valgono solo se APPROVATE e da
   quel momento fanno parte dell'importo della commessa. Le ore dell'extra sono
   un dato Righi (mai esposto al fornitore) e rientrano in carico e capacita',
   altrimenti la pianificazione si sfaserebbe in silenzio. */
const jobExtraList = j => (j&&j.extra)||[];
function extraApprovato(j){ return jobExtraList(j).reduce((s,e)=>s+(Number(e.importo)||0),0); }
function extraOre(j){ return jobExtraList(j).reduce((s,e)=>s+(Number(e.ore)||0),0); }
function jobOre(j){ return (j?(j.oreStimate||0):0) + extraOre(j); }
// importo finale della commessa: concordato + extra approvati
function jobImporto(j){ return jobImportoBase(j) + extraApprovato(j); }
// soglia di escalation: oltre il 10% dell'importo concordato decide il responsabile
function extraSoglia(j){ return Math.round(jobImportoBase(j)*EXTRA_SOGLIA_PERC/100); }
function extraRichieste(jid){ return (graphIndex().reqByJob[jid]||[]).filter(r=>r.tipo==="extra"); }
function extraAperti(jid){ return extraRichieste(jid).filter(r=>r.stato!=="chiusa"); }
// chi puo' decidere questo extra: il caposquadra entro soglia, il responsabile sempre
function canApproveExtra(u, r, j){ if(!canProduzione(u)||!r) return false;
  if(!isCapo(u)) return true;
  return (Number(r.importo)||0) <= extraSoglia(j); }
function supplierMetrics(sid){
  const cache=metricsCache(); const hit=cache.get(sid); if(hit) return hit;   // memo per versione di stato
  const gi=graphIndex();
  const jobs=gi.jobsBySup[sid]||[];                                           // adiacenza fornitore-commesse
  const delivered=jobs.filter(j=>j.stato==="consegnato"&&j.dataRientroEff);
  const valoreAttivo=jobs.filter(j=>["assegnato","in_corso"].includes(j.stato)).reduce((s,j)=>s+jobImporto(j),0);
  const valoreConsegnato=delivered.reduce((s,j)=>s+jobImporto(j),0);
  const onTime=delivered.filter(j=> j.dataRientroEff<=j.dataRientro).length;
  const puntualita=delivered.length? Math.round(onTime/delivered.length*100) : null;
  const lateDel=delivered.filter(j=> j.dataRientroEff>j.dataRientro);
  const ritardoMedio=lateDel.length? Math.round(lateDel.reduce((s,j)=>s+(daysBetween(j.dataRientro,j.dataRientroEff)||0),0)/lateDel.length) : 0;
  const slittamenti=jobs.reduce((s,j)=>s+((j.storicoDate&&j.storicoDate.length)||0),0);
  const perMonth={}; jobs.filter(j=>j.assegnatoAt).forEach(j=>{ const k=monthKey(j.assegnatoAt); perMonth[k]=(perMonth[k]||0)+1; });
  const months=Object.keys(perMonth).sort(); const takenTotal=jobs.filter(j=>j.assegnatoAt).length;
  const perMeseAvg=months.length? takenTotal/months.length : 0;
  const reqs=gi.reqBySup[sid]||[]; const richiestePerTipo={};                 // adiacenza fornitore-richieste
  reqs.forEach(r=>{ richiestePerTipo[r.tipo]=(richiestePerTipo[r.tipo]||0)+1; });
  const invited=gi.invBySup[sid]||[];                                         // adiacenza fornitore-inviti
  const acceptedJobIds=new Set((gi.respBySup[sid]||[]).filter(r=>r.tipo==="accettazione").map(r=>r.jobId));
  const acceptedInvited=invited.filter(j=> j.assegnatoA===sid || acceptedJobIds.has(j.id)).length;
  const tassoAccett=invited.length? Math.round(acceptedInvited/invited.length*100) : null;
  const accs=(gi.respBySup[sid]||[]).filter(r=>r.tipo==="accettazione");      // adiacenza fornitore-risposte
  const respTimes=accs.map(a=>{ const j=gi.jobById[a.jobId]; return (j&&j.publishedAt)? daysBetween(j.publishedAt,(a.at||"").slice(0,10)) : null; }).filter(x=>x!=null&&x>=0);
  const tempoRisposta=respTimes.length? Math.round(respTimes.reduce((s,x)=>s+x,0)/respTimes.length*10)/10 : null;
  // Extra: quanto spesso la commessa cresce rispetto a quanto concordato.
  // Metrica oggettiva e uguale per Righi e fornitore (nessun giudizio, solo fatti).
  const conExtra=jobs.filter(j=>jobExtraList(j).length);
  const assegnate=jobs.filter(j=>j.assegnatoAt);
  const quotaExtra=assegnate.length? Math.round(conExtra.length/assegnate.length*100) : null;
  const baseTot=assegnate.reduce((sm,j)=>sm+jobImportoBase(j),0);
  const extraTot=assegnate.reduce((sm,j)=>sm+extraApprovato(j),0);
  const scostamento=baseTot? Math.round(extraTot/baseTot*1000)/10 : 0;   // % sul concordato
  const res={ puntualita, ritardoMedio, slittamenti, perMonth, months, takenTotal, perMeseAvg,
    conExtra:conExtra.length, quotaExtra, extraTot, scostamento,
    richiestePerTipo, richiesteTot:reqs.length, tassoAccett, tempoRisposta,
    oreAttive:activeHours(sid), valoreAttivo, valoreConsegnato,
    commesseAttive:jobs.filter(j=>["assegnato","in_corso"].includes(j.stato)).length, consegnate:delivered.length };
  cache.set(sid,res); return res;
}
