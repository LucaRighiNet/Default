/* CSV */
function csvCell(v){ v=(v==null?"":String(v)); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(rows){ return "﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"); }
function downloadFile(name, text, mime){ const a=document.createElement("a"); a.href="data:"+(mime||"text/csv")+";charset=utf-8,"+encodeURIComponent(text); a.download=name; a.style.display="none"; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),0); }
function parseCSV(text){ text=text.replace(/^﻿/,""); const firstLine=(text.split(/\r?\n/)[0]||""); const delim=(firstLine.split(";").length>=firstLine.split(",").length)?";":","; const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===delim){ row.push(cur); cur=""; } else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(c==='\r'){} else cur+=c; } }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

/* filtro/ordinamento per la vista massiva */
function filteredJobs(){
  const f=App.filters; let a=scopedJobs().slice();
  if(f.stato==="da_assegnare") a=a.filter(j=>j.stato==="pubblicato");
  else if(f.stato==="attivi") a=a.filter(j=>["assegnato","in_corso"].includes(j.stato));
  else if(f.stato) a=a.filter(j=>j.stato===f.stato);
  if(f.late) a=a.filter(isLate);
  if(f.tipologia) a=a.filter(j=>j.tipologia===f.tipologia);
  if(f.settore) a=a.filter(j=>j.settore===f.settore);
  if(f.capo) a=a.filter(j=>j.capoId===f.capo);
  if(f.fornitore) a=a.filter(j=>j.assegnatoA===f.fornitore);
  if(f.q){ const q=f.q.toLowerCase(); a=a.filter(j=>{ const s=supplier(j.assegnatoA); const c=capo(j.capoId);
    return (j.title+" "+j.code+" "+j.settore+" "+TIPOLOGIE[j.tipologia].short+" "+(s?s.name:"")+" "+(c?c.name:"")).toLowerCase().includes(q); }); }
  const k=App.sort.key, dir=App.sort.dir;
  a.sort((x,y)=>{ let vx,vy;
    if(k==="rientro"){vx=keyDate(x);vy=keyDate(y);}
    else if(k==="budget"){vx=x.budget||0;vy=y.budget||0;}
    else if(k==="ore"){vx=x.oreStimate||0;vy=y.oreStimate||0;}
    else if(k==="code"){vx=x.code;vy=y.code;}
    else if(k==="stato"){vx=x.stato;vy=y.stato;}
    else {vx=x.title;vy=y.title;}
    return vx<vy?-dir:vx>vy?dir:0; });
  return a;
}

// Semaforo salute commessa (predittivo)
function jobHealth(j){
  if(["consegnato","chiuso"].includes(j.stato)) return {level:"done",label:"Consegnato"};
  if(j.stato==="bozza") return {level:"draft",label:"Bozza"};
  if(isLate(j)) return {level:"rosso",label: isLateReturn(j)?"Rientro in ritardo":"Inizio in ritardo"};
  // pubblicati/da_approvare: la scadenza per assegnare è governata dall'INIZIO stimato
  if(["pubblicato","da_approvare"].includes(j.stato)){ const dstart=daysTo(j.dataInizioStimata); const hasAcc=jobResponses(j.id).some(r=>r.tipo==="accettazione");
    if(dstart!=null&&dstart<7&&!hasAcc) return {level:"rosso",label:"Urgente da assegnare"};
    if(dstart!=null&&dstart<15&&!hasAcc) return {level:"giallo",label:"Da assegnare"};
    return {level:"verde",label:"In tempo"}; }
  // assegnati/in corso non in ritardo: monitoraggio verso il RIENTRO
  const dret=daysTo(j.dataRientro);
  const stepIdx=j.avanzamento?AVZ_ORDER.indexOf(j.avanzamento)+1:0;
  const m=j.assegnatoA?supplierMetrics(j.assegnatoA):null; const punt=(m&&m.puntualita!=null)?m.puntualita:85;
  if(j.stato==="assegnato"){ const dstart=daysTo(j.dataInizioStimata); if(dstart!=null&&dstart<3) return {level:"giallo",label:"Inizio imminente"}; }
  if(dret!=null){
    if(dret<7&&stepIdx<3) return {level:"rosso",label:"A rischio ritardo"};
    if(dret<14&&stepIdx<2) return {level:"giallo",label:"Da monitorare"};
    if(dret<21&&punt<75&&stepIdx<3) return {level:"giallo",label:"Fornitore poco puntuale"};
  }
  return {level:"verde",label:"In tempo"};
}
function healthDot(j){ const h=jobHealth(j); if(["done","draft"].includes(h.level)) return ""; return `<span class="hdot ${h.level}" title="${h.label}"></span>`; }
// Assegnazione intelligente: punteggio fornitori per una commessa
function prefFor(sup, capoId){ return (sup && sup.preferenze && capoId && sup.preferenze[capoId]) || 0; }
// Fornitori esclusi dai suggerimenti perche' non in regola, con il motivo.
function suggestEsclusi(){
  return STATE.suppliers.filter(s=>s.accredited&&s.attivo&&!isAssegnabile(s.id))
    .map(s=>({sid:s.id, name:s.name, motivo:motivoBlocco(s.id)}));
}
function suggestSuppliers(job){ const mk=monthKey(keyDate(job)); const need=job.oreStimate||0;
  const needHv=job.tipologia==="potenza"; const needFood=/food|farmaceutico/i.test(job.settore);
  // Concorrono solo i fornitori ASSEGNABILI: accreditati, attivi e con i
  // documenti obbligatori in regola. Chi e' escluso viene contato a parte
  // (vedi suggestEsclusi) e mostrato con il motivo: mai una sparizione muta.
  return STATE.suppliers.filter(s=>isAssegnabile(s.id)).map(s=>{ const m=supplierMetrics(s.id); let score=0; const reasons=[];
    // % di utilizzo preferenziale dell'OTL (caposquadra) della commessa — dal file Mappatura
    const pref=prefFor(s, job.capoId);
    if(pref>0){ score+=pref*0.5; if(pref>=50) reasons.push("preferito OTL"); else if(pref>=20) reasons.push("preferenza OTL"); }
    if(s.specialties.includes(job.tipologia)){ score+=35; reasons.push("specializzato"); }
    if(s.settori.includes(job.settore)){ score+=20; reasons.push("settore"); }
    if(needHv&&s.certificazioni.includes("hv")){ score+=12; reasons.push(">250A"); }
    if(needFood&&s.certificazioni.includes("food")){ score+=10; reasons.push("igienico"); }
    if(!fitsSpazio(s, job.ingombro)){ score-=45; reasons.push("spazio insuff."); }
    const free=freeCapacity(s.id,mk);
    if(free>=need){ score+=20; reasons.push("capacità"); } else if(free>0){ score+=8; } else { score-=12; reasons.push("saturo"); }
    if(m.puntualita!=null){ score+=Math.round((m.puntualita-70)/3); if(m.puntualita>=90) reasons.push("puntuale"); } else { score+=3; }
    return {sid:s.id, score, free, need, overload:free<need, spazioOk:fitsSpazio(s, job.ingombro), pref, reasons, puntualita:m.puntualita };
  }).sort((a,b)=>b.score-a.score);
}
/* ---- Collo di bottiglia della capacità (max-flow / min-cut) ----------------
   Rete di flusso: sorgente -> commesse (cap = ore) -> fornitori che hanno
   accettato (cap = ore) -> pozzo (cap = ore libere del fornitore nel mese).
   Il MAX-FLOW è la domanda collocabile; per il teorema max-flow/min-cut il
   TAGLIO MINIMO (archi saturi che separano sorgente e pozzo) individua il
   vincolo: i fornitori raggiungibili nel grafo residuo sono i colli di
   bottiglia (saturi e vincolanti). La capacità è per-MESE, quindi il problema
   si decompone per mese di rientro (un piccolo max-flow indipendente per mese). */
function maxflowMinCut(N, arcs, S, T){
  const to=[], cap=[], g=Array.from({length:N},()=>[]);
  const add=(u,v,c)=>{ g[u].push(to.length); to.push(v); cap.push(c);
                       g[v].push(to.length); to.push(u); cap.push(0); };  // arco + reverse (ei ^ 1)
  for(const a of arcs) add(a[0],a[1],a[2]);
  let flow=0;
  for(;;){
    const par=new Array(N).fill(-1); par[S]=-2; const q=[S];
    for(let h=0; h<q.length && par[T]===-1; h++){ const u=q[h];
      for(const ei of g[u]){ const v=to[ei]; if(par[v]===-1 && cap[ei]>0){ par[v]=ei; q.push(v); } } }
    if(par[T]===-1) break;
    let f=Infinity; for(let v=T; v!==S; v=to[par[v]^1]) f=Math.min(f, cap[par[v]]);
    for(let v=T; v!==S; v=to[par[v]^1]){ cap[par[v]]-=f; cap[par[v]^1]+=f; }
    flow+=f;
  }
  const reach=new Array(N).fill(false); reach[S]=true; const q=[S];
  for(let h=0; h<q.length; h++){ const u=q[h]; for(const ei of g[u]){ const v=to[ei]; if(!reach[v]&&cap[ei]>0){ reach[v]=true; q.push(v); } } }
  return { flow, reach };
}
function capacityBottleneck(){
  const gi=graphIndex();
  const jobs=scopedJobs().filter(j=>j.stato==="pubblicato" && (gi.respByJob[j.id]||[]).some(r=>r.tipo==="accettazione"));
  const byMonth={}; for(const j of jobs){ const m=monthKey(keyDate(j)); (byMonth[m]=byMonth[m]||[]).push(j); }
  const out=[];
  for(const m of Object.keys(byMonth).sort()){
    const js=byMonth[m];
    const supSet=new Set(); js.forEach(j=>(gi.respByJob[j.id]||[]).filter(r=>r.tipo==="accettazione").forEach(r=>supSet.add(r.supplierId)));
    const sups=[...supSet]; const sIx={}; sups.forEach((sid,i)=>sIx[sid]=i);
    const C=js.length, K=sups.length, S=0, T=C+K+1, N=T+1;
    const arcs=[]; let demand=0;
    js.forEach((j,i)=>{ const h=j.oreStimate||0; demand+=h; arcs.push([S,1+i,h]);
      new Set((gi.respByJob[j.id]||[]).filter(r=>r.tipo==="accettazione").map(r=>r.supplierId)).forEach(sid=>{
        if(sIx[sid]!=null && fitsSpazio(supplier(sid), j.ingombro)) arcs.push([1+i, 1+C+sIx[sid], h]); }); });
    const capOf={}; sups.forEach((sid,k)=>{ const c=Math.max(0, freeCapacity(sid, m)); capOf[sid]=c; arcs.push([1+C+k, T, c]); });
    const { flow, reach } = maxflowMinCut(N, arcs, S, T);
    // fornitori vincolanti = nodi fornitore raggiungibili nel residuo (saturi e sul taglio)
    const binding=sups.filter((sid,k)=>reach[1+C+k]).map(sid=>({sid, cap:capOf[sid]})).sort((a,b)=>a.cap-b.cap);
    out.push({ m, demand, placeable:flow, shortfall:demand-flow, jobsN:C, binding });
  }
  return { months: out.filter(x=>x.demand>0), totShort: out.reduce((s,x)=>s+(x.demand-x.placeable),0) };
}
// Proiezione geografica (lat/lng -> x/y su viewBox 100×50) per la mappa SVG offline
function projGeo(lat,lng){ const LAT=[43.2,45.95], LNG=[7.4,13.9];   // Nord-Centro Italia
  const x=7+((lng-LNG[0])/(LNG[1]-LNG[0]))*86; const y=7+(1-(lat-LAT[0])/(LAT[1]-LAT[0]))*36; return {x, y}; }

/* Costruisce il cartiglio (vedi il commento del CSS omonimo).
   celle:   {label, v, sub, mk, allarme, act, data}
   strisce: {label, q, cls} — la ripartizione in cima, proporzionale.
   Le celle cliccabili sono <button>: prima erano <div>, quindi irraggiungibili
   da tastiera pur essendo la via principale per entrare nei filtri. */
function cartiglio(celle, strisce){
  const seg=(strisce||[]).filter(x=>x.q>0);
  const tot=seg.reduce((n,x)=>n+x.q,0);
  const bar = seg.length>1
    ? `<div class="crt-bar" role="img" aria-label="Ripartizione: ${esc(seg.map(x=>x.q+" "+x.label.toLowerCase()).join(", "))}">
        ${seg.map(x=>{
          // sotto l'8% la scritta uscirebbe troncata: resta il solo colore.
          // Sopra, la dicitura per intero sui monitor larghi e il solo numero
          // dove lo spazio non basta (vedi le media query di .crt-seg).
          const testo = (x.q/tot >= 0.08)
            ? `<span class="lg">${x.q} ${esc(x.label.toLowerCase())}</span><span class="sm">${x.q}</span>` : "";
          return `<span class="crt-seg ${x.cls||"cf-muted"}" style="flex:${x.q}" title="${esc(x.label)}: ${x.q}">${testo}</span>`;
        }).join("")}</div>`
    : "";
  const cella=c=>{
    const dentro = `<span class="k">${c.mk?`<i class="mk ${c.mk}"></i>`:""}${esc(c.label)}</span>
      <span class="v">${esc(String(c.v))}</span>${c.sub?`<span class="s">${c.sub}</span>`:""}`;
    const cls = "crt-cell"+(c.allarme?" allarme":"");
    if(!c.act) return `<div class="${cls}">${dentro}</div>`;
    const attr = Object.keys(c.data||{}).map(k=>` data-${k}="${esc(c.data[k])}"`).join("");
    return `<button class="${cls}" data-act="${c.act}"${attr}>${dentro}</button>`;
  };
  return `<div class="cartiglio">${bar}<div class="crt-cells">${celle.map(cella).join("")}</div></div>`;
}

// Riga del scadenzario: stato, chi, cosa, e i pulsanti che servono a chiuderla.
function scadRiga(r, puoAgire){
  const g=r.giorni;
  const quando = r.stato==="mancante" ? "mai consegnato"
    : g==null ? "senza scadenza"
    : g<0 ? "scaduto da "+(-g)+" gg"
    : g===0 ? "scade oggi" : "fra "+g+" gg · "+fmtDate(r.doc.scadenza);
  const azioni = puoAgire
    ? `${r.stato==="in_verifica"?`<button class="btn sm accent" data-act="docVerify" data-sup="${r.sid}" data-t="${r.tipo}">${icon("check","sm")} Verifica</button>
         <button class="btn sm danger" data-act="docReject" data-sup="${r.sid}" data-t="${r.tipo}">Respingi</button>`:""}
       <button class="btn sm ghost" data-act="docRenew" data-sup="${r.sid}" data-t="${r.tipo}">${r.stato==="mancante"?"Registra":"Rinnova"}</button>` : "";
  return `<div class="lrow" style="align-items:flex-start" data-act="supDetail" data-sup="${r.sid}">
    <span class="ic ${DOC_PILL[r.stato]==="ok"?"ok":DOC_PILL[r.stato]==="warn"?"accent":DOC_PILL[r.stato]==="info"?"info":"danger"}">${icon(r.stato==="valido"?"check":r.stato==="in_verifica"?"clock":"bolt","sm")}</span>
    <span class="gr"><b>${esc(r.fornitore)} — ${esc(r.meta.label)}</b>
      <span class="s">${esc(quando)}${r.blocca?" · <b>bloccante</b>":r.meta.obbl?" · richiesto, non bloccante":" · facoltativo"}${r.meta.visibile==="righi"?" · solo Righi":""}</span></span>
    <span class="lrow-act">
      <span class="pill ${DOC_PILL[r.stato]}">${DOC_LABEL[r.stato]}</span>${azioni}</span></div>`;
}

function viewRighiDashboard(){
  const u=currentUser(); const capo_=isCapo(u); const base=scopedJobs();
  const scopedIds=new Set(base.map(j=>j.id));
  const pub=base.filter(j=>j.stato==="pubblicato").length;
  const ass=base.filter(j=>["assegnato","in_corso"].includes(j.stato)).length;
  const late=base.filter(isLate);
  const risk=base.filter(j=>!isLate(j)&&["pubblicato","assegnato","in_corso"].includes(j.stato)&&["giallo","rosso"].includes(jobHealth(j).level));
  const openReq=scopedRequests().filter(r=>r.stato==="aperta");
  const daApprovare=base.filter(j=>j.stato==="da_approvare");
  // Da valutare: commesse pubblicate con almeno un'accettazione, RAGGRUPPATE per
  // commessa (così più fornitori sulla stessa commessa si vedono insieme) e
  // sempre presenti finché la commessa non è assegnata (non dipende dal "letto").
  const daValutare=base.filter(j=>j.stato==="pubblicato")
    .map(j=>({j, accs:jobResponses(j.id).filter(r=>r.tipo==="accettazione")}))
    .filter(x=>x.accs.length>0)
    .sort((a,b)=> ((b.accs.some(r=>!r.read)?1:0)-(a.accs.some(r=>!r.read)?1:0)) || (b.accs.length-a.accs.length));

function reqRow(r){ const j=byId(STATE.jobs,r.jobId),s=supplier(r.supplierId),t=REQ_TYPES[r.tipo],c=capo(r.capoId);

  return `<button class="lrow ${!r.read?'unread':''}" data-req="${r.id}" style="width:100%">
    <span class="ic ${t.pill==='danger'?'danger':t.pill==='warn'?'accent':'info'}">${icon(r.tipo==='materiale'?'inbox':r.tipo==='ritardo'?'clock':r.tipo==='slittamento'?'calendar':'mail')}</span>

function filterBar(){

  const statoChips=[["","Tutti"],["da_approvare","Da approvare"],["da_assegnare","Da assegnare"],["attivi","Assegnati/In corso"],["consegnato","Consegnati"],["bozza","Bozze"]];
  const active=[];

  if(f.settore) active.push(["settore",f.settore]);
  if(f.capo) active.push(["capo",(capo(f.capo)||{}).name]);
  if(f.fornitore) active.push(["fornitore",(supplier(f.fornitore)||{}).name]);
  if(f.late) active.push(["late","Solo ritardi"]);
  return `<div class="filters">
    <div class="filt-row">
      <div class="searchbox">${icon("search")}<input id="lav-search" placeholder="Cerca per titolo, commessa, fornitore, settore…" value="${esc(f.q)}"></div>
      <button class="chip sm ${f.late?'on accent':''}" data-act="toggleLate">${icon("clock","sm")} Ritardi</button>
    </div>
    <div class="filt-row" style="margin-top:9px">${statoChips.map(([v,l])=>`<button class="chip sm ${f.stato===v?'on':''}" data-act="setStatoFilter" data-v="${v}">${l}</button>`).join("")}</div>
    <div class="filt-adv">
      <select class="sel" data-adv="tipologia"><option value="">Tipologia (tutte)</option>${Object.entries(TIPOLOGIE).map(([k,v])=>`<option value="${k}" ${f.tipologia===k?'selected':''}>${v.short}</option>`).join("")}</select>
      <select class="sel" data-adv="settore"><option value="">Settore (tutti)</option>${SETTORI.map(s=>`<option value="${esc(s)}" ${f.settore===s?'selected':''}>${esc(s)}</option>`).join("")}</select>
      <select class="sel" data-adv="capo"><option value="">Caposquadra (tutti)</option>${STATE.capi.map(c=>`<option value="${c.id}" ${f.capo===c.id?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
      <select class="sel" data-adv="fornitore"><option value="">Fornitore (tutti)</option>${STATE.suppliers.map(s=>`<option value="${s.id}" ${f.fornitore===s.id?'selected':''}>${esc(s.name)}</option>`).join("")}</select>
    </div>
    ${active.length?`<div class="filt-active">${active.map(([k,l])=>`<span class="fchip">${esc(l)}<button data-act="clearFilter" data-k="${k}">${icon("x","sm")}</button></span>`).join("")}<button class="fchip" data-act="clearAll" style="background:var(--surface-2);color:var(--ink-soft);border-color:var(--line)">Azzera tutto</button></div>`:""}

function tableHtml(){
  const all=filteredJobs(); const shown=all.slice(0,App.page*PAGE);
  const rline=`<div class="result-line"><span><b style="color:var(--ink)">${all.length}</b> lavori${all.length?` · mostrati ${shown.length}`:""}</span><span>${all.filter(isLate).length} in ritardo</span></div>`;
  if(!all.length) return `${rline}<div class="empty">${icon("search")}<p>Nessun lavoro con questi filtri</p><button class="btn ghost sm" data-act="clearAll" style="margin-top:10px">Azzera filtri</button></div>`;
  const more=all.length>shown.length?`<div class="morebtn"><button class="btn ghost" data-act="more">Mostra altri ${Math.min(PAGE,all.length-shown.length)} (${all.length-shown.length} rimanenti)</button></div>`:"";
  if(isNarrow()) return `${rline}<div class="jlist">${shown.map(jobItem).join("")}</div>${more}`;
  const th=(k,l,extra)=>`<th class="sortable ${extra||''}" data-act="sortBy" data-k="${k}">${l} ${App.sort.key===k?icon("sort","sm"):""}</th>`;

function jobItem(j){ const t=TIPOLOGIE[j.tipologia], st=STATI[j.stato], late=isLate(j), s=supplier(j.assegnatoA);

function boardHtml(){

// date (oggi / +21g), allegati (nuovo layout), stato e assegnatario.
function duplicateJob(jid){ const j=byId(STATE.jobs,jid); if(!j) return;
  App.draft={ title:j.title, tipologia:j.tipologia, settore:j.settore, lavorazioni:(j.lavorazioni||[]).slice(), ingombro:j.ingombro||"",
    budget:j.budget||"", ore:j.oreStimate||"", capoId:j.capoId, visibility:j.visibility||"tutti",
    invitati:(j.invitati||[]).slice(), descrizione:j.descrizione||"",
    dataInizioStimata:dISO(7), dataRientro:dISO(18), dataConsegna:dISO(21), allegati:[], emailNotify:true };
  closeModal(); App.tab="nuovo"; render(); window.scrollTo(0,0);
  toast("Commessa duplicata — aggiorna layout e date","ok");
}
// Fornitori suggeriti per la bozza corrente (auto-matching in pubblicazione).

}

function mapHtml(){
  const u=currentUser(); const capoZone=isCapo(u); const myZones={}; const usedByCapo=new Set();
  if(capoZone){ STATE.jobs.filter(j=>j.capoId===u.capoId&&["assegnato","in_corso"].includes(j.stato)&&j.assegnatoA).forEach(j=>{ const s=supplier(j.assegnatoA); if(s){ myZones[s.zona]=(myZones[s.zona]||0)+1; usedByCapo.add(s.id); } }); }
  const hq=projGeo(RIGHI_HQ.lat,RIGHI_HQ.lng);
  const mapSups=STATE.suppliers.filter(s=>s.attivo && s.lat!=null && s.lng!=null);  // solo attivi con sede nota
  const lines=mapSups.map(s=>{ const p=projGeo(s.lat,s.lng); return `<line x1="${hq.x.toFixed(1)}" y1="${hq.y.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#9aa8b0" stroke-width="0.25" stroke-dasharray="0.8 0.8" opacity="0.5"/>`; }).join("");
  const pins=mapSups.map(s=>{ const p=projGeo(s.lat,s.lng); const r=loadRatio(s.id); const col=r>1?"#C0392B":r>=0.7?"#B4791A":"#2E7D53"; const used=usedByCapo.has(s.id);
    return `<g class="pin" data-act="supDetail" data-sup="${s.id}">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="transparent"/>
      ${used?`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.1" fill="none" stroke="#1E2748" stroke-width="0.6"/>`:""}
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="1.9" fill="${col}" stroke="#fff" stroke-width="0.4"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y-2.6).toFixed(1)}" text-anchor="middle" font-size="2.4" fill="#15242B">${esc(s.citta)}</text></g>`; }).join("");
  return `<div class="map-wrap"><svg class="map-svg" viewBox="0 0 100 50" role="img" aria-label="Mappa fornitori Righi">
    <rect x="0" y="0" width="100" height="50" fill="#e9eff2"/>
    ${lines}
    <g><rect x="${(hq.x-1.5).toFixed(1)}" y="${(hq.y+2.5).toFixed(1)}" width="3" height="3" transform="rotate(45 ${hq.x.toFixed(1)} ${(hq.y+4).toFixed(1)})" fill="#1E2748"/><text x="${hq.x.toFixed(1)}" y="${(hq.y+8.5).toFixed(1)}" text-anchor="middle" font-size="2.6" font-weight="700" fill="#141B33">Righi HQ</text></g>
    ${pins}
  </svg></div>
  <div class="map-legend"><span><i style="background:#2E7D53"></i>carico basso</span><span><i style="background:#B4791A"></i>quasi saturo</span><span><i style="background:#C0392B"></i>saturo</span>${capoZone?`<span><i style="background:transparent;border:1.5px solid #1E2748"></i>già usato da te</span>`:""}</div>
  ${(capoZone&&Object.keys(myZones).length)?`<div class="card" style="margin-top:12px"><div class="sect-t">Le tue zone attive — ottimizza i trasporti</div><div class="tags">${Object.entries(myZones).map(([z,n])=>`<span class="pill brand">${esc(z)}: ${n} commesse</span>`).join("")}</div><p class="muted" style="font-size:12px;margin:8px 0 0">Accorpa i nuovi lavori dove hai già squadre attive per ridurre le trasferte.</p></div>`:""}
  <p class="muted" style="font-size:12px;margin-top:10px">Tocca un pin per scheda, metriche e capacità libera del fornitore. Il colore indica il carico del mese corrente.</p>`;
}
// mesi disponibili (dal corrente in avanti) con almeno una consegna, sempre includi corrente..+2
function caricoMesi(){ const cur=monthKey(todayISO()); const set=new Set([cur]);
  const d=new Date(cur+"-01T12:00:00"); for(let i=1;i<=3;i++){ d.setMonth(d.getMonth()+1); set.add(d.toISOString().slice(0,7)); }
  STATE.jobs.filter(j=>["assegnato","in_corso"].includes(j.stato)&&j.assegnatoA&&j.dataRientro>=cur).forEach(j=>set.add(monthKey(j.dataRientro)));
  return [...set].sort().slice(0,6);
}
function caricoChartHtml(mk){
  const stateWord={verde:"sotto capacità",giallo:"quasi saturo",rosso:"oltre capacità"};
  const attivi=STATE.suppliers.filter(s=>s.attivo);
  const rows=attivi.map(s=>{ const load=monthLoad(s.id,mk); const cap=s.capacitaMese||0; const ratio=cap?load/cap:0;
    const commesse=STATE.jobs.filter(j=>["assegnato","in_corso"].includes(j.stato)&&j.assegnatoA===s.id&&monthKey(j.dataRientro)===mk).length;
    return {s, load, cap, ratio, commesse, state: ratio>1?"rosso":ratio>=0.85?"giallo":"verde"}; }).sort((a,b)=>b.load-a.load);
  const axisMax=Math.max(200, Math.ceil(Math.max(...attivi.map(s=>s.capacitaMese||0), ...rows.map(r=>r.load))/200)*200);
  const totLoad=rows.reduce((a,r)=>a+r.load,0), totCap=rows.reduce((a,r)=>a+r.cap,0);
  return `<div class="loadchart">${rows.map(r=>{ const free=r.cap-r.load;
    return `<div class="loadrow">
      <div class="loadrow-h"><b>${esc(r.s.name)}</b><span class="ln">${r.load}/${r.cap} h · ${Math.round(r.ratio*100)}% · <span class="st ${r.state}">${stateWord[r.state]}</span></span></div>
      <div class="loadbar" data-act="supDetail" data-sup="${r.s.id}" title="${esc(r.s.name)} — ${r.load}/${r.cap} h (${Math.round(r.ratio*100)}%) · ${free>=0?free+' h liberi':Math.abs(free)+' h oltre capacità'} · ${r.commesse} commesse nel mese">
        <div class="cap" style="width:${(r.cap/axisMax*100).toFixed(1)}%"></div>
        <div class="fill ${r.state}" style="width:${Math.min(r.load/axisMax*100,100).toFixed(1)}%"></div>
        <div class="capline" style="left:${(r.cap/axisMax*100).toFixed(1)}%"></div></div>
    </div>`;}).join("")}</div>
  <div class="load-axis"><span>0</span><span>${Math.round(axisMax/2)} h</span><span>${axisMax} h</span></div>
  <div class="map-legend"><span><i class="lg verde"></i>sotto capacità</span><span><i class="lg giallo"></i>quasi saturo (≥85%)</span><span><i class="lg rosso"></i>oltre capacità</span><span><span style="display:inline-block;width:2px;height:12px;background:var(--ink-soft);margin-right:5px;vertical-align:middle"></span>capacità mensile</span></div>
  <p class="muted" style="font-size:12px;margin-top:8px">Totale mese: <b>${totLoad} h</b> su ${totCap} h di capacità · tocca una barra per la scheda del fornitore.</p>`;
}
function caricoMatrixHtml(){ const load=supplierMonthlyLoad(); const months=caricoMesi();
  return `<div class="scroll-x"><table class="tbl" style="min-width:560px"><thead><tr><th>Fornitore</th><th class="num">Cap./mese</th>${months.map(m=>`<th class="num">${monthLabel(m)}</th>`).join("")}<th class="num">Totale attivo</th></tr></thead>
    <tbody>${STATE.suppliers.filter(s=>s.attivo).map(s=>{ const row=load.map[s.id]||{}; const tot=activeHours(s.id);

    }).join("")}</tbody></table></div>`;
}
/* ==================== VIEW: Righi — Analisi (cruscotto grafici) ==================== */
// Tutti gli aggregati usano scopedJobs(): il caposquadra vede solo le proprie commesse.
function consegneByMonth(){ const map={};
  scopedJobs().forEach(j=>{ const m=monthKey(j.dataConsegna); if(!m) return; (map[m]=map[m]||{da:0,att:0,cons:0});
    if(["bozza","da_approvare","pubblicato"].includes(j.stato)) map[m].da++;
    else if(["assegnato","in_corso"].includes(j.stato)) map[m].att++; else map[m].cons++; });
  const months=Object.keys(map).sort();
  return { months, map, max:Math.max(1,...months.map(m=>map[m].da+map[m].att+map[m].cons)) };
}
function pipelineStati(){ const jobs=scopedJobs();
  const order=[["bozza","Bozze"],["da_approvare","Da approvare"],["pubblicato","Da assegnare"],["assegnato","Assegnate"],["in_corso","In corso"],["consegnato","Consegnate"],["chiuso","Chiuse"]];
  const rows=order.map(([st,lab])=>({st,lab,n:jobs.filter(j=>j.stato===st).length})).filter(r=>r.n>0);
  return { rows, max:Math.max(1,...rows.map(r=>r.n)) };
}
function saluteCounts(){ const attive=scopedJobs().filter(j=>["pubblicato","assegnato","in_corso"].includes(j.stato));
  const c={verde:0,giallo:0,rosso:0}; attive.forEach(j=>{ const l=jobHealth(j).level; c[l]=(c[l]||0)+1; });
  return { ...c, tot:attive.length, late:scopedJobs().filter(isLate).length };
}
function puntualitaByMonth(){ const deliv=scopedJobs().filter(j=>["consegnato","chiuso"].includes(j.stato)&&j.dataRientroEff);
  const map={}; deliv.forEach(j=>{ const m=monthKey(j.dataRientroEff); (map[m]=map[m]||{ok:0,late:0});
    if(j.dataRientroEff<=j.dataRientro) map[m].ok++; else map[m].late++; });
  const months=Object.keys(map).sort();
  return { months, map, tot:deliv.length, max:Math.max(1,...months.map(m=>map[m].ok+map[m].late)) };
}
function tipologiaMix(){ const jobs=scopedJobs();
  const rows=Object.entries(TIPOLOGIE).map(([k,v])=>({k,lab:v.short,dot:v.dot,n:jobs.filter(j=>j.tipologia===k).length}));
  return { rows, max:Math.max(1,...rows.map(r=>r.n)) };
}
function capoCarico(){ const jobs=scopedJobs();
  const rows=STATE.capi.map(c=>({id:c.id,name:c.name,n:jobs.filter(j=>j.capoId===c.id&&["assegnato","in_corso"].includes(j.stato)).length}))
    .filter(r=>r.n>0).sort((a,b)=>b.n-a.n);
  return { rows, max:Math.max(1,...rows.map(r=>r.n)) };
}
function emptyChart(msg){ return `<div class="empty" style="padding:20px">${icon("inbox")}<p>${esc(msg)}</p></div>`; }
function chartConsegne(){ const d=consegneByMonth(); if(!d.months.length) return emptyChart("Nessuna commessa con data di consegna");
  const segs=[["da","cf-warn","Da assegnare"],["att","cf-info","Assegnate / in corso"],["cons","cf-ok","Consegnate"]];
  return `<div class="vchart">${d.months.map(m=>{ const v=d.map[m], tot=v.da+v.att+v.cons;
    return `<div class="vcol-wrap"><div class="vcol-tot">${tot}</div>
      <div class="vcol" style="height:${Math.round(tot/d.max*132)}px" title="${monthLabel(m)}: ${tot} consegne — ${v.da} da assegnare, ${v.att} attive, ${v.cons} consegnate">
        ${segs.map(([k,cls])=> v[k]?`<div class="vseg ${cls}" style="height:${(v[k]/tot*100).toFixed(1)}%"></div>`:"").join("")}
      </div><div class="vcol-x">${monthLabel(m)}</div></div>`; }).join("")}</div>
    <div class="map-legend" style="margin-top:10px">${segs.map(([k,cls,lab])=>`<span><i class="lg ${cls}"></i>${lab}</span>`).join("")}</div>`;
}
function chartPipeline(){ const d=pipelineStati(); if(!d.rows.length) return emptyChart("Nessuna commessa");
  return `<div class="hchart">${d.rows.map(r=>`<div class="hrow click" data-act="chartFilter" data-k="stato" data-v="${r.st}" title="${r.lab}: ${r.n} commesse">
    <span class="hlab">${r.lab}</span><div class="htrack"><div class="hbar cf-brand" style="width:${Math.max(r.n/d.max*100,2).toFixed(1)}%"></div></div><span class="hval">${r.n}</span></div>`).join("")}</div>
    <p class="chart-note" style="margin:8px 0 0">Tocca una fase per aprire l'elenco filtrato.</p>`;
}
function chartSalute(){ const d=saluteCounts(); if(!d.tot) return emptyChart("Nessuna commessa attiva");
  const segs=[["verde","cf-ok","sotto controllo",d.verde],["giallo","cf-warn","da tenere d'occhio",d.giallo],["rosso","cf-danger","a rischio",d.rosso]];
  return `<div class="stackbar">${segs.map(([k,cls,lab,n])=> n?`<div class="stackseg ${cls}" style="width:${(n/d.tot*100).toFixed(1)}%" title="${lab}: ${n}">${(n/d.tot)>0.06?n:""}</div>`:"").join("")}</div>
    <div class="map-legend" style="margin-top:10px">${segs.map(([k,cls,lab,n])=>`<span><i class="lg ${cls}"></i>${lab} — <b>${n}</b></span>`).join("")}</div>
    <p class="chart-note" style="margin:8px 0 0">${d.late?`<b style="color:var(--danger)">${d.late}</b> già in ritardo · `:""}semaforo predittivo su ${d.tot} commesse attive.${(d.rosso+d.giallo)?` <a class="lnk" data-act="chartFilter" data-k="stato" data-v="attivi">Vedi le attive</a>`:""}</p>`;
}
function chartPuntualita(){ const d=puntualitaByMonth(); if(!d.tot) return emptyChart("Ancora nessuna consegna registrata");
  return `<div class="vchart">${d.months.map(m=>{ const v=d.map[m], tot=v.ok+v.late, pct=Math.round(v.ok/tot*100);
    return `<div class="vcol-wrap"><div class="vcol-tot">${pct}%</div>
      <div class="vcol" style="height:${Math.round(tot/d.max*132)}px" title="${monthLabel(m)}: ${v.ok} puntuali, ${v.late} in ritardo (${pct}%)">
        ${v.late?`<div class="vseg cf-danger" style="height:${(v.late/tot*100).toFixed(1)}%"></div>`:""}
        ${v.ok?`<div class="vseg cf-ok" style="height:${(v.ok/tot*100).toFixed(1)}%"></div>`:""}
      </div><div class="vcol-x">${monthLabel(m)}</div></div>`; }).join("")}</div>
    <div class="map-legend" style="margin-top:10px"><span><i class="lg cf-ok"></i>puntuali</span><span><i class="lg cf-danger"></i>in ritardo</span></div>
    <p class="chart-note" style="margin:8px 0 0">${d.tot} consegne registrate. Il valore in alto è la puntualità del mese.</p>`;
}
function chartMix(){ const d=tipologiaMix();
  return `<div class="hchart">${d.rows.map(r=>`<div class="hrow click" data-act="chartFilter" data-k="tipologia" data-v="${r.k}" title="${r.lab}: ${r.n} commesse">
    <span class="hlab"><span class="dot ${r.dot}"></span>${r.lab}</span><div class="htrack"><div class="hbar cf-${r.dot}" style="width:${Math.max(r.n/d.max*100,2).toFixed(1)}%"></div></div><span class="hval">${r.n}</span></div>`).join("")}</div>
    <p class="chart-note" style="margin:8px 0 0">Tocca una tipologia per filtrare le commesse.</p>`;

function chartCapo(){ const d=capoCarico(); if(!d.rows.length) return emptyChart("Nessuna commessa attiva");
  return `<div class="hchart">${d.rows.map(r=>`<div class="hrow click" data-act="chartFilter" data-k="capo" data-v="${r.id}" title="${esc(r.name)}: ${r.n} commesse attive">
    <span class="hlab">${esc(r.name)}</span><div class="htrack"><div class="hbar cf-brand" style="width:${Math.max(r.n/d.max*100,2).toFixed(1)}%"></div></div><span class="hval">${r.n}</span></div>`).join("")}</div>`;
}
function chartBottleneck(){
  const d=capacityBottleneck();
  if(!d.months.length) return emptyChart("Nessuna commessa da assegnare con accettazioni");
  const short=d.months.filter(x=>x.shortfall>0);
  if(!short.length) return `<div class="card" style="background:var(--ok-tint);border-color:#bfe0cd;box-shadow:none;display:flex;gap:9px;align-items:center"><span class="lrow" style="padding:0"></span><span style="color:#256844;font-size:13.5px">${icon("check","sm")} <b>Nessun collo di bottiglia</b>: tutta la domanda con accettazioni è collocabile nella capacità disponibile.</span></div>`;
  return short.map(x=>{
    const pW=Math.round(x.placeable/x.demand*100), sW=100-pW;
    const bind=x.binding.slice(0,8).map(b=>{const s=supplier(b.sid); return `<span class="pill danger" style="cursor:pointer" data-act="supJobs" data-sup="${b.sid}">${esc(s?s.name:b.sid)} · ${b.cap}h libere</span>`;}).join("");
    return `<div style="margin-bottom:15px">
      <div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px;flex-wrap:wrap"><b>${monthLabel(x.m)}</b><span class="muted">domanda ${x.demand}h · collocabili ${x.placeable}h · <b style="color:var(--danger)">mancano ${x.shortfall}h</b></span></div>
      <div class="stackbar">${pW>0?`<div class="stackseg cf-ok" style="width:${pW}%">${pW>=14?x.placeable+'h':''}</div>`:''}<div class="stackseg cf-danger" style="width:${sW}%">${sW>=14?x.shortfall+'h':''}</div></div>
      <div class="tags" style="margin-top:8px;align-items:center">${x.binding.length?`<span class="muted" style="font-size:11.5px">Fornitori vincolanti (min-cut):</span>${bind}`:`<span class="muted" style="font-size:11.5px">${icon("bolt","sm")} Nessun fornitore compatibile con capacità libera: il vincolo è lo <b>spazio</b> o le <b>accettazioni</b>, non le ore — serve accreditare o ampliare l'ingombro lavorabile.</span>`}</div>
    </div>`;
  }).join("");
}

function viewMiei(u){
  let jobs=STATE.jobs.filter(j=>j.assegnatoA===u.supplierId);
  const attesa=jobsForSupplier(u.supplierId).filter(j=>j.stato==="pubblicato"&&jobResponses(j.id).some(r=>r.supplierId===u.supplierId&&r.tipo==="accettazione"));
  const f=App.fFilters; const q=(f.q||"").toLowerCase();
  if(f.stato==="attivi") jobs=jobs.filter(j=>["assegnato","in_corso"].includes(j.stato));
  else if(f.stato==="consegnato") jobs=jobs.filter(j=>["consegnato","chiuso"].includes(j.stato));
  else if(f.stato==="late") jobs=jobs.filter(isLate);
  if(q) jobs=jobs.filter(j=>(j.title+" "+j.code+" "+j.settore).toLowerCase().includes(q));
  const all=STATE.jobs.filter(j=>j.assegnatoA===u.supplierId);

  const chips=[["","Tutte"],["attivi","Attive"],["consegnato","Consegnate"],["late","In ritardo"]];

function openModal(html){ $("#modal-host").innerHTML=`<div class="modal-bg" data-close-bg><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $("#modal-host").innerHTML=""; }
function modalHead(title){ return `<div class="modal-h"><h3>${title}</h3><button class="x" data-act="closeModal" aria-label="Chiudi">${icon("x")}</button></div>`; }
// Conferma riutilizzabile per azioni critiche (mitiga i click accidentali).
// o = {title, body, confirmLabel, confirmAct, data:{k:v}, kind, backAct, backData}
// Sul "Conferma" scatta confirmAct con i data-*; su "Annulla" si torna a backAct (o si chiude).
function confirmAttrs(obj){ return Object.entries(obj||{}).map(([k,v])=>`data-${k}="${esc(String(v))}"`).join(" "); }
function openConfirm(o){
  const back = o.backAct ? `data-act="${o.backAct}" ${confirmAttrs(o.backData)}` : `data-act="closeModal"`;
  openModal(`${modalHead(o.title||"Confermi?")}
    <p style="font-size:14px;line-height:1.5;margin:2px 0 16px">${o.body||"Vuoi procedere?"}</p>
    <div class="btn-row">
      <button class="btn ghost" ${back}>Annulla</button>
      <button class="btn ${o.kind||'accent'}" data-act="${o.confirmAct}" ${confirmAttrs(o.data)}>${o.confirmLabel||"Conferma"}</button>
    </div>`);
}

// Riepilogo economico degli extra sulla commessa. Il fornitore vede gli importi
// (e' il suo compenso); le ore restano un dato interno di Righi.
function extraBlock(j, isRighi){
  const list=jobExtraList(j); const aperti=extraAperti(j.id);
  if(!list.length && !aperti.length) return "";
  const base=jobImportoBase(j);
  return `<div class="divide"></div><div class="sect-t">${icon("bolt","sm")} Extra sulla commessa</div>
    ${list.map(e=>`<div class="lrow"><span class="ic ok">${icon("check","sm")}</span><span class="gr"><b>${esc(EXTRA_TIPI[e.tipo]||"Extra")} — ${fmtMoney(e.importo)}</b><span class="s">${esc(e.motivo||"")}${isRighi&&e.ore?" · "+e.ore+" h":""} · approvato il ${esc((e.at||"").replace("T"," "))}</span></span></div>`).join("")}
    ${aperti.map(r=>`<div class="lrow" data-req="${r.id}"><span class="ic accent">${icon("clock","sm")}</span><span class="gr"><b>${esc(EXTRA_TIPI[r.extraTipo]||"Extra")} — ${fmtMoney(r.importo)}</b><span class="s">in attesa di decisione${isRighi&&(Number(r.importo)||0)>extraSoglia(j)?" · oltre il "+EXTRA_SOGLIA_PERC+"%: serve il responsabile":""}</span></span><span class="arw">${icon("chev")}</span></div>`).join("")}
    <div class="row2" style="margin-top:8px">
      <div class="dl"><span class="k">Importo concordato</span><span class="v">${fmtMoney(base)}</span></div>
      <div class="dl"><span class="k">Extra approvati</span><span class="v">${fmtMoney(extraApprovato(j))}</span></div>
    </div>
    <div class="dl"><span class="k">Importo totale della commessa</span><span class="v" style="color:var(--accent-deep);font-size:16px">${fmtMoney(jobImporto(j))}</span></div>`;
}
function avanzamentoBlock(j, editable){
  if(!["assegnato","in_corso"].includes(j.stato)) return "";
  const cur=j.avanzamento?AVZ_ORDER.indexOf(j.avanzamento):-1;
  return `<div class="divide"></div><div class="sect-t">Avanzamento produzione</div>
    <div class="progress">${AVZ_ORDER.map((k,i)=>`<span class="seg ${i<=cur?'on':''}"></span>`).join("")}</div>
    <div class="steps">${AVZ_ORDER.map((k,i)=> editable
      ? `<button class="step ${i<cur?'done':i===cur?'cur':''}" data-act="setAvz" data-job="${j.id}" data-step="${k}">${AVANZAMENTO[k].label}</button>`
      : `<span class="step ${i<cur?'done':i===cur?'cur':''}">${AVANZAMENTO[k].label}</span>`).join("")}</div>
    ${editable?`<p class="muted" style="font-size:12px;margin:6px 0 0">Tocca lo stato raggiunto: Righi lo vede subito.</p>`:(j.avanzamentoAt?`<p class="muted" style="font-size:12px;margin:6px 0 0">Ultimo aggiornamento: ${esc((j.avanzamentoAt||'').replace('T',' '))}</p>`:"")}`;
}
function openJobModal(jid){
  const u=currentUser(); const j=byId(STATE.jobs,jid); if(!j) return;
  const t=TIPOLOGIE[j.tipologia], st=STATI[j.stato], c=capo(j.capoId), s=supplier(j.assegnatoA), late=isLate(j);
  const isRighi=u.role==="righi";
  const layout=(j.allegati||[]).find(a=>a.layout);
  const others=(j.allegati||[]).filter(a=>!a.layout);
  const resp=jobResponses(j.id);
  const reqs=jobRequests(j.id);
  if(isRighi){ resp.forEach(r=>{ if(r.from==="fornitore") r.read=true; }); }
  let footer="";
  if(isRighi){
    if(j.stato==="bozza"){
      footer=isCapo(u)
        ? `<button class="btn accent block" data-act="submitApproval" data-job="${j.id}">${icon("send")} Invia per approvazione</button>`
        : `<button class="btn accent block" data-act="publish" data-job="${j.id}">${icon("send")} Pubblica lavoro</button>`;
    } else if(j.stato==="da_approvare"){
      footer=isCapo(u)
        ? `<span class="pill warn lg">In attesa di approvazione del responsabile</span>`
        : `<div class="btn-row"><button class="btn ghost" data-act="rejectJob" data-job="${j.id}">${icon("x","sm")} Rimanda</button><button class="btn accent" data-act="approveJob" data-job="${j.id}">${icon("check")} Approva e pubblica</button></div>`;
    } else if(j.stato==="pubblicato"){
      const cand=resp.filter(r=>r.tipo==="accettazione");
      footer=`<div class="btn-row"><button class="btn ghost" data-act="notifyPick" data-job="${j.id}">${icon("bell","sm")} Notifica fornitori</button>
        ${cand.length?`<button class="btn accent" data-act="assignPick" data-job="${j.id}">${icon("check")} Assegna (${cand.length})</button>`:`<span class="pill plain" style="align-self:center">In attesa di accettazioni</span>`}</div>`;
    } else if(j.stato==="consegnato"){
      // chiusura della pratica: e' lo stato finale, prima mancava il modo di arrivarci
      footer=`<div class="btn-row"><button class="btn accent" data-act="closeJob" data-job="${j.id}">${icon("check")} Chiudi la pratica</button></div>`;
    } else if(["assegnato","in_corso"].includes(j.stato)){
      footer=`<div class="btn-row">${s?`<button class="btn ghost" data-act="emailJobSup" data-job="${j.id}">${icon("mail","sm")} Email fornitore</button>`:""}<button class="btn ghost" data-act="editDate" data-job="${j.id}">${icon("calendar","sm")} Modifica data</button><button class="btn" data-act="setStato" data-job="${j.id}" data-s="consegnato">Segna consegnato</button></div>`;
    }
    // Duplica commessa (Righi): riparte una nuova bozza dagli stessi dati
    footer=`<div class="btn-row" style="margin-bottom:8px"><button class="btn ghost sm" data-act="dupJob" data-job="${j.id}">${icon("copy","sm")} Duplica come nuova commessa</button></div>`+footer;
  } else {
    const mine=resp.filter(r=>r.supplierId===u.supplierId);
    const accepted=mine.some(r=>r.tipo==="accettazione");
    if(j.stato==="pubblicato"&&!accepted) footer=`<div class="btn-row"><button class="btn ghost" data-act="ask" data-job="${j.id}">Fai una domanda</button><button class="btn accent" data-act="accept" data-job="${j.id}">${icon("check")} Accetta proposta</button></div>`;
    else if(j.assegnatoA===u.supplierId){
      const contatta=`<button class="btn ghost" data-act="quickReq" data-job="${j.id}">${icon("send","sm")} Contatta il caposquadra</button>`;
      if(["assegnato","in_corso"].includes(j.stato)){
        const reqOpen=jobRequests(j.id).some(r=>r.tipo==="collaudo"&&r.stato!=="chiusa");
        if(j.consegnaApprovata) footer=`<div class="btn-row">${contatta}<button class="btn accent" data-act="deliverJob" data-job="${j.id}">${icon("check")} Segna consegnato</button></div>`;
        else if(reqOpen) footer=`<span class="pill warn lg">Richiesta di consegna inviata — in attesa dell'approvazione del caposquadra</span><div class="btn-row" style="margin-top:8px">${contatta}</div>`;
        else footer=`<div class="btn-row">${contatta}<button class="btn accent" data-act="reqConsegna" data-job="${j.id}">${icon("send","sm")} Pronto alla consegna — chiedi approvazione</button></div>`;
      } else footer=`<div class="btn-row">${contatta}</div>`;
    }
    else if(accepted) footer=`<span class="pill ok lg">Proposta inviata — in attesa di Righi</span>`;
  }
  const thread = resp.filter(r=>["accettazione","domanda"].includes(r.tipo) && (isRighi||r.supplierId===u.supplierId));
  openModal(`${modalHead(esc(j.title))}
    <div class="tags" style="margin-bottom:12px"><span class="pill ${late?'danger':st.pill}">${late?'In ritardo':st.label}</span>${tipPill(j.tipologia)}<span class="pill plain">${esc(j.settore)}</span><span class="mono muted" style="align-self:center;font-size:11px">${esc(j.code)}</span></div>
    ${(isRighi&&j.stato==="da_approvare")?`<div class="card leftbar" style="border-left:4px solid var(--warn);margin-bottom:10px;padding:9px 12px"><b style="color:var(--warn)">${icon("bolt","sm")} Da approvare</b><span class="muted" style="font-size:12.5px;margin-left:6px">richiesta da ${esc((byId(STATE.users,j.richiedente)||{}).name||(c?c.name:'caposquadra'))}</span></div>`:""}
    ${(isRighi&&j.stato==="bozza"&&j.approvazione&&j.approvazione.esito==="rifiutata")?`<div class="card leftbar" style="border-left:4px solid var(--danger);margin-bottom:10px;padding:9px 12px"><b style="color:var(--danger)">${icon("x","sm")} Da rivedere</b>${j.approvazione.motivo?`<p class="muted" style="font-size:12.5px;margin:3px 0 0">${esc(j.approvazione.motivo)}</p>`:`<span class="muted" style="font-size:12.5px;margin-left:6px">rimandata dal responsabile</span>`}</div>`:""}
    ${(j.consegnaApprovata&&["assegnato","in_corso"].includes(j.stato))?`<div class="card leftbar" style="border-left:4px solid var(--ok);margin-bottom:10px;padding:9px 12px"><b style="color:var(--ok)">${icon("check","sm")} Consegna approvata</b><span class="muted" style="font-size:12.5px;margin-left:6px">dal caposquadra · ${esc((j.consegnaApprovata.at||'').replace('T',' '))}</span></div>`:""}
    <div class="row2">
      <div class="dl"><span class="k">Budget indicativo</span><span class="v">${fmtMoney(j.budget)}</span></div>
      <div class="dl"><span class="k">Inizio lavori stimato</span><span class="v">${fmtDate(j.dataInizioStimata)}${(j.stato==="assegnato"&&isLateStart(j))?' <span class="pill danger" style="margin-left:2px">da avviare</span>':''}</span></div>
      <div class="dl"><span class="k">Rientro in Righi</span><span class="v">${fmtDate(j.dataRientro)} <span class="soft" style="font-weight:400">(${relDays(j.dataRientro)})</span>${isLateReturn(j)?' <span class="pill danger" style="margin-left:2px">in ritardo</span>':''}</span></div>
      ${isRighi?`<div class="dl"><span class="k">Consegna al cliente</span><span class="v">${fmtDate(j.dataConsegna)} <span class="soft" style="font-weight:400">· riservato Righi</span></span></div>`:""}
      ${isRighi?`<div class="dl"><span class="k">Data pubblicazione</span><span class="v">${j.publishedAt?fmtDate(j.publishedAt):'<span class="muted" style="font-weight:400">non ancora pubblicata</span>'}</span></div>`:""}
      <div class="dl"><span class="k">Caposquadra</span><span class="v">${c?esc(c.name):'—'}</span></div>
      ${isRighi?`<div class="dl"><span class="k">Ore stimate produzione</span><span class="v">${j.oreStimate?j.oreStimate+' h':'—'}</span></div>`:""}
      <div class="dl"><span class="k">Lavorazioni industrializzate</span><span class="v">${(j.lavorazioni&&j.lavorazioni.length)?lavLabels(j.lavorazioni).map(esc).join(" · "):'—'}</span></div>
      ${j.ingombro?`<div class="dl"><span class="k">Ingombro previsto</span><span class="v">${esc(DIMENSIONI[j.ingombro].label)}</span></div>`:""}
      <div class="dl"><span class="k">${isRighi?'Visibilità':'Assegnato a'}</span><span class="v">${isRighi?(j.visibility==='tutti'?'Tutti i fornitori':(j.invitati||[]).length+' selezionati'):(s?esc(s.name):'—')}</span></div>
    </div>
    ${j.descrizione?`<div class="dl"><span class="k">Note tecniche</span><span class="v" style="font-weight:400;line-height:1.5">${esc(j.descrizione)}</span></div>`:""}
    ${layout?`<div class="attach layout" style="margin:4px 0 8px" data-act="openAtt" data-att="${layout.id}" data-job="${j.id}"><span class="fi">${icon("layout")}</span><span class="gr"><b>${esc(layout.name)}</b><span>Layout per quotazione · ${esc(layout.size||'')}</span></span><span class="btn sm ghost">Apri</span></div>`:""}
    ${others.map(a=>`<div class="attach" style="margin-bottom:6px" data-act="openAtt" data-att="${a.id}" data-job="${j.id}"><span class="fi">${icon("doc")}</span><span class="gr"><b>${esc(a.name)}</b><span>${esc(a.size||a.type||'')}</span></span><span class="btn sm ghost">Apri</span></div>`).join("")}
    ${isRighi&&s?`<div class="dl" style="margin-top:8px"><span class="k">Fornitore</span><span class="v">${esc(s.name)} · ${esc(s.citta)}</span></div>`:""}
    ${thread.length?`<div class="divide"></div><div class="sect-t">Conversazione</div><div class="thread">${thread.map(msgHtml).join("")}</div>`:""}
    ${(j.storicoDate&&j.storicoDate.length)?`<div class="divide"></div><div class="sect-t">${icon("calendar","sm")} Storico rientro</div><div class="rowlist">${j.storicoDate.slice().reverse().map(h=>`<div class="lrow" style="padding:8px 4px"><span class="ic ${h.tipo==='slittamento'?'accent':'info'}">${icon("calendar")}</span><span class="gr"><b>${fmtDate(h.from)} ${icon("chev","sm")} ${fmtDate(h.to)}</b><span class="s">${h.tipo==='slittamento'?'Slittamento':'Modifica'}${h.byRole?' · '+esc(h.byRole):''}${h.motivo?' · '+esc(h.motivo):''}</span></span></div>`).join("")}</div>`:""}
    ${extraBlock(j, isRighi)}
    ${avanzamentoBlock(j, !isRighi && j.assegnatoA===u.supplierId)}
    ${isRighi&&reqs.length?`<div class="divide"></div><div class="sect-t">Richieste sulla commessa</div><div class="rowlist">${reqs.map(reqRow).join("")}</div>`:""}
    ${footer?`<div class="divide"></div>${footer}`:""}`);
  if(isRighi) persist();
}
function msgHtml(r){ const s=supplier(r.supplierId); const mineSide=(currentUser().role==="fornitore"); const us=(r.from==="fornitore")===mineSide;
  const who=r.from==="fornitore"?(s?s.name:"Fornitore"):"Righi";
  const label=r.tipo==="accettazione"?("Ha accettato"+(r.importo?" — "+fmtMoney(r.importo):"")):r.tipo==="domanda"?"Domanda":"";
  const firma=r.firma?`<div class="firma-sign">${icon("check","sm")} Firmato da ${esc(r.firma.nome)} · ${esc((r.firma.ts||'').slice(0,10).split('-').reverse().join('/'))}</div>`:"";
  return `<div class="msg ${us?'us':'them'}"><div class="who">${esc(who)}${label?" · "+label:""}</div><div>${esc(r.testo)}</div>${firma}<div class="t">${esc((r.at||'').replace('T',' '))}</div></div>`;
}

function openAssignPick(jid){ const j=byId(STATE.jobs,jid);
  const sMap={}; suggestSuppliers(j).forEach(r=>sMap[r.sid]=r);
  const cand=jobResponses(j.id).filter(r=>r.tipo==="accettazione").sort((a,b)=>((sMap[b.supplierId]||{}).score||0)-((sMap[a.supplierId]||{}).score||0));
  const capoN=(capo(j.capoId)||{}).name||"—";

function sendQuickReply(rid, testo){ if(vietatoQhse()) return; const r=byId(STATE.requests,rid); if(!r||!testo) return; const u=currentUser();

  const volevaEmail=wantReplyEmail(); const s0=supplier(r.supplierId);

  persist(); Sfx.play("messaggio"); toast("Risposta inviata"+esito, sent||!volevaEmail?"ok":"warn"); openReqDetail(rid);

        : `<span class="pill plain">${esc(profiloChip(u))}</span>`}</span>

function setProfilo(userId, nuovo){
  const me=currentUser(); if(!isResp(me)){ toast("Solo il responsabile di produzione","warn"); return; }
  const u=byId(STATE.users,userId); if(!u||u.role!=="righi"||!PROFILI[nuovo]||PROFILI[nuovo].lato!=="righi"){ toast("Profilo non valido","warn"); return; }
  if(u.id===me.id){ toast("Non puoi cambiare il tuo stesso profilo","warn"); return; }
  if(profiloDi(u)===nuovo){ toast("Profilo già assegnato","warn"); return; }
  if(isResp(u) && responsabiliAttivi().length<=1){ toast("È l'ultimo responsabile di produzione attivo: assegnane un altro prima","warn"); return; }
  // il caposquadra ha una squadra collegata: diventando altro non la porta con se'
  if(nuovo!=="caposquadra") delete u.capoId;
  else if(!u.capoId){ const cid=uid("cs"); STATE.capi.push({id:cid,name:u.name,tel:"",email:u.email||""}); u.capoId=cid; }
  u.righiRole=nuovo; u.ruolo=PROFILI[nuovo].ruolo;
  persist(); Sfx.play("approvazione"); toast(u.name+": profilo "+PROFILI[nuovo].chip,"ok"); render(); openProfili();
}
// Disattivare un accesso toglie i permessi e chiude la porta: non e' cosmetico.
function toggleUtente(userId){
  const me=currentUser(); if(!isResp(me)){ toast("Solo il responsabile di produzione","warn"); return; }
  const u=byId(STATE.users,userId); if(!u){ toast("Accesso non trovato","warn"); return; }
  if(u.id===me.id){ toast("Non puoi disattivare l'accesso che stai usando","warn"); return; }
  if(utenteAttivo(u) && isResp(u) && responsabiliAttivi().length<=1){ toast("È l'ultimo responsabile di produzione attivo","warn"); return; }
  u.attivo = !utenteAttivo(u);
  // spegnere l'accesso di un fornitore che ha lavoro in corso vuol dire che le
  // notifiche del portale non lo raggiungono piu': meglio dirlo subito
  const attive = (!u.attivo && u.supplierId)
    ? STATE.jobs.filter(j=>j.assegnatoA===u.supplierId && ["assegnato","in_corso"].includes(j.stato)).length : 0;
  persist(); Sfx.play(u.attivo?"approvazione":"avviso");
  toast(u.name+(u.attivo?": accesso riattivato":": accesso disattivato")
    + (attive?" · ha "+attive+" commesse in corso e non riceverà più le notifiche nel portale":""), u.attivo?"ok":"warn");
  render(); openProfili();
}

function createUser(){ const role=(App.userDraft&&App.userDraft.role)||"fornitore";
  const name=($("#nu-name").value||"").trim(); const email=($("#nu-email").value||"").trim();
  if(!name){ toast("Inserisci il nome","warn"); $("#nu-name").focus(); return; }
  const p=name.split(/\s+/); const autoMail=(slug(p[0])[0]||"x")+"."+slug(p[p.length-1])+"@righinet.com";
  const u={ id:uid("u"), name, email:email||autoMail };
  if(role==="fornitore"){ const sid=$("#nu-sup")?$("#nu-sup").value:""; if(!sid){ toast("Scegli il fornitore collegato","warn"); return; }
    u.role="fornitore"; u.supplierId=sid; }
  else if(role==="caposquadra"){ const cid=uid("cs"); STATE.capi.push({id:cid,name,tel:"",email:u.email});
    u.role="righi"; u.righiRole="caposquadra"; u.capoId=cid; }
  else { u.role="righi"; u.righiRole=PROFILI[role]?role:"responsabile"; }
  u.attivo=true; u.ruolo=(profilo(u)||PROFILI.responsabile).ruolo;   // etichetta dal registro, mai riscritta a mano
  STATE.users.push(u); persist(); App.userDraft=null; closeModal();
  toast("Accesso creato: "+name,"ok"); openSwitch();
}

      <div class="field"><label>Ingombro max lavorabile</label><select class="inp" id="ns-dim">${Object.entries(DIMENSIONI).map(([k,v])=>`<option value="${k}" ${d.dimensioneMax===k?'selected':''}>${esc(v.label)}</option>`).join("")}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Referente</label><input class="inp" id="ns-ref" value="${esc(d.referente||'')}" placeholder="es. Mario Rossi"></div>

      <div class="chips">${Object.entries(CERT).map(([k,v])=>chip('certificazioni',k,esc(v),'')).join("")}</div></div>

      <div class="chips">${Object.entries(ATTREZZATURE).map(([k,v])=>chip('attrezzature',k,esc(v),'')).join("")}</div></div>

// Legge il form nell'oggetto fornitore (scalari dal DOM, array/chip dal draft d)
function readSupplierForm(d){
  const citta=$("#ns-citta").value; const c=CITY[citta]||[44.14,12.24,"Romagna"];
  const num=id=>{ const v=$(id)?$(id).value:""; return v===""?null:Number(v); };
  const pref={}; STATE.capi.forEach(cp=>{ const el=$("#ns-pref-"+cp.id); const v=el?el.value:""; if(v!=="") pref[cp.id]=Number(v); });
  return { name:($("#ns-name").value||"").trim(), citta, lat:c[0], lng:c[1], zona:c[2],
    capacitaMese:num("#ns-cap")||0, costoOrario:num("#ns-costo"), cablatori:num("#ns-cab"), risorseDedicate:num("#ns-ris"),
    dimensioneMax:$("#ns-dim").value||"m", referente:($("#ns-ref").value||"").trim(), email:($("#ns-email").value||"").trim(),
    attivo:!$("#ns-attivo")||$("#ns-attivo").checked, preferenze:pref, note:($("#ns-note").value||"").trim()||null,
    specialties:(d.specialties||[]).slice(), settori:(d.settori||[]).slice(), certificazioni:(d.certificazioni||[]).slice(), attrezzature:(d.attrezzature||[]).slice() };
}
function openNewSupplier(){
  if(!isResp(currentUser())){ toast("Solo il responsabile di produzione può accreditare un fornitore","warn"); return; }
  const d=App.supDraft={ name:"",citta:"Cesena",referente:"",email:"",specialties:[],settori:[],certificazioni:[],attrezzature:[],dimensioneMax:"m",capacitaMese:1000,attivo:true,preferenze:{} };
  openModal(`${modalHead("Nuovo fornitore")}
    <p class="muted" style="font-size:13px;margin-top:0">Accredita un fornitore: i dati alimentano suggerimenti di assegnazione, mappa e carico.</p>
    ${supplierFormFields(d)}
    <button class="btn accent block" data-act="createSup">${icon("check")} Accredita fornitore</button>`);
}
function createSupplier(){ const d=App.supDraft||{}; const f=readSupplierForm(d);
  if(!f.name){ toast("Inserisci la ragione sociale","warn"); $("#ns-name").focus(); return; }
  const sup=Object.assign({ id:uid("sup"), accredited:true }, f);
  if(!sup.email) sup.email="preventivi@"+slug(f.name)+".it";
  STATE.suppliers.push(sup); App.supDraft=null; persist(); closeModal();
  toast("Fornitore accreditato","ok"); openSupplierModal(sup.id);
}
function openEditSupplier(sid){
  if(!isResp(currentUser())){ toast("Solo il responsabile di produzione può modificare la scheda","warn"); return; }
  const s=supplier(sid); if(!s) return;
  const d=App.supDraft={ name:s.name, citta:s.citta, referente:s.referente, email:s.email, capacitaMese:s.capacitaMese,
    costoOrario:s.costoOrario, cablatori:s.cablatori, risorseDedicate:s.risorseDedicate, dimensioneMax:s.dimensioneMax,
    attivo:s.attivo, note:s.note, preferenze:Object.assign({}, s.preferenze||{}),
    specialties:(s.specialties||[]).slice(), settori:(s.settori||[]).slice(), certificazioni:(s.certificazioni||[]).slice(), attrezzature:(s.attrezzature||[]).slice() };
  openModal(`${modalHead("Modifica fornitore")}
    <p class="muted" style="font-size:13px;margin-top:0">Aggiorna i dati del fornitore: alimentano suggerimenti, mappa, carico e collo di bottiglia.</p>
    ${supplierFormFields(d)}
    <button class="btn accent block" data-act="saveSup" data-sup="${sid}">${icon("check")} Salva modifiche</button>`);
}
function saveSupplier(sid){ if(!isResp(currentUser())){ toast("Solo il responsabile di produzione può modificare la scheda","warn"); return; }
  const s=supplier(sid); if(!s) return; const d=App.supDraft||{}; const f=readSupplierForm(d);
  if(!f.name){ toast("Inserisci la ragione sociale","warn"); $("#ns-name").focus(); return; }
  Object.assign(s, f); if(!s.email) s.email="preventivi@"+slug(f.name)+".it";
  App.supDraft=null; persist(); closeModal(); toast("Scheda fornitore aggiornata","ok"); openSupplierModal(sid);
}

function toast(msg,kind){ Sfx.esito(kind); const t=$("#toast"); t.className="toast show "+(kind||""); t.textContent=msg; clearTimeout(toast._t); toast._t=setTimeout(()=>t.className="toast "+(kind||""),2400); }

/* Il profilo QHSE presidia la parte documentale: le commesse non sono cose sue.
   Il controllo sta QUI, nella funzione, non solo nelle schede che non gli
   mostriamo: un'azione richiamata direttamente deve fallire lo stesso. */
function vietatoQhse(){ const u=currentUser();
  if(canProduzione(u)) return false;
  toast(isQhse(u) ? "Profilo QHSE: le commesse le governa il responsabile di produzione"
                  : "Azione riservata al personale Righi", "warn");
  return true; }
function doPublish(jid){ if(vietatoQhse()) return; const j=byId(STATE.jobs,jid); if(!j) return; j.stato="pubblicato"; j.publishedAt=todayISO();
  notifyJob(j, j.visibility==="selezionati"?(j.invitati||[]):STATE.suppliers.map(s=>s.id));
  persist(); closeModal(); Sfx.play("pubblicazione"); toast("Lavoro pubblicato","ok"); render(); }
function notifyJob(j, supplierIds){
  supplierIds.forEach(sid=>{ notifySupplier(sid,{ic:"bolt",txt:"Nuovo lavoro: "+j.title,sub:j.code+" · "+fmtMoney(j.budget),jobId:j.id}); });
}
function copyText(txt){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast("Copiato negli appunti","ok"),()=>toast("Copia non riuscita","warn")); else toast("Copia non supportata su questo dispositivo","warn"); }

function importJobsCSV(text){
  const rows=parseCSV(text); if(rows.length<2){ toast("File vuoto o senza righe dati","warn"); return; }
  const head=rows[0].map(h=>slug(h)); const idx=n=>head.indexOf(n);
  const iTit=idx("titolo"),iTip=idx("tipologia"),iSet=idx("settore"),iLav=idx("lavorazioni"),iBud=idx("budget"),iOre=idx("ore"),iIni=idx("datainizio"),iRit=idx("datarientro"),iCon=idx("dataconsegna"),iCap=idx("caposquadra"),iVis=idx("visibilita");
  if(iTit<0){ toast("Manca la colonna 'titolo' — usa il template","warn"); return; }
  const num=v=>v?Number(String(v).replace(/[^\d]/g,"")):null; let n=STATE.jobs.reduce((m,j)=>Math.max(m,parseInt((j.code||"").split("-")[1])||0),2400), added=0;
  for(let r=1;r<rows.length;r++){ const row=rows[r]; const tit=(row[iTit]||"").trim(); if(!tit) continue;
    const tip=["automazione","distribuzione","potenza"].includes(slug(row[iTip]||""))?slug(row[iTip]):"automazione";
    const lavs=parseLavorazioni(iLav>=0?row[iLav]:"");
    const cap=STATE.capi.find(c=>slug(c.name)===slug(iCap>=0?row[iCap]:""))||STATE.capi[0];
    const vis=(slug(row[iVis]||"")==="selezionati")?"selezionati":"tutti";
    n++; added++;
    const dCons=(iCon>=0&&row[iCon])?row[iCon].trim():dISO(21);
    const dRit=(iRit>=0&&row[iRit])?row[iRit].trim():addDays(dCons,-3);
    const dIni=(iIni>=0&&row[iIni])?row[iIni].trim():addDays(dRit,-10);
    STATE.jobs.unshift({ id:uid("j"), code:"RGH-"+n, title:tit, tipologia:tip,
      settore:(iSet>=0&&row[iSet])?row[iSet].trim():SETTORI[0], lavorazioni:lavs, budget:num(row[iBud]), oreStimate:num(row[iOre]),
      dataInizioStimata:dIni, dataRientro:dRit, dataConsegna:dCons,
      capoId:cap.id, descrizione:"", allegati:[], visibility:vis, invitati:[], stato:"bozza", assegnatoA:null, publishedAt:null, createdAt:todayISO(),
      dataRientroBase:dRit, storicoDate:[], dataRientroEff:null, assegnatoAt:null, avanzamento:null }); }
  persist(); toast(added+" commesse importate in bozza","ok");
  App.tab="lavori"; App.lavoriMode="table"; App.filters={q:"",stato:"bozza",tipologia:"",settore:"",capo:"",fornitore:"",late:false}; App.page=1; render();
}

/* ---- Assegnazione ottima (matching sul grafo bipartito con capacità) -------
   Commesse pubblicate con accettazioni = nodi sinistra; fornitori che hanno
   accettato = nodi destra; arco pesato dal punteggio di suggestSuppliers.
   Vincolo: ore libere per fornitore e per MESE di rientro. L'assegnamento
   indivisibile con capacità è NP-arduo (GAP): usiamo il matching greedy globale
   di peso massimo — esatto sulla capacità, deterministico, e PROPOSTO (il
   responsabile conferma). Concorrono solo gli archi ammissibili (spazio ok). */
function assignOptimal(){
  const gi=graphIndex();
  const jobs=scopedJobs().filter(j=>j.stato==="pubblicato" && (gi.respByJob[j.id]||[]).some(r=>r.tipo==="accettazione"));
  const edges=[];
  for(const j of jobs){
    const accepted=new Set((gi.respByJob[j.id]||[]).filter(r=>r.tipo==="accettazione").map(r=>r.supplierId));
    for(const cand of suggestSuppliers(j)){
      if(!accepted.has(cand.sid) || cand.spazioOk===false) continue;
      edges.push({jid:j.id, sid:cand.sid, score:cand.score, hours:j.oreStimate||0, mk:monthKey(keyDate(j))});
    }
  }
  // ordine globale per peso decrescente (tie-break deterministici): matching greedy
  edges.sort((a,b)=> b.score-a.score || a.hours-b.hours || (a.jid<b.jid?-1:a.jid>b.jid?1:0) || (a.sid<b.sid?-1:a.sid>b.sid?1:0));
  const rem={};
  const freeOf=(sid,mk)=>{ rem[sid]=rem[sid]||{}; if(rem[sid][mk]==null) rem[sid][mk]=freeCapacity(sid,mk); return rem[sid][mk]; };
  const takenJob={}, proposal=[];
  for(const e of edges){
    if(takenJob[e.jid]) continue;                 // ogni commessa a un solo fornitore
    if(freeOf(e.sid,e.mk) < e.hours) continue;    // capacità del mese insufficiente
    takenJob[e.jid]=true; rem[e.sid][e.mk]-=e.hours; proposal.push(e);
  }
  const unplaceable=jobs.filter(j=>!takenJob[j.id]).map(j=>j.id);
  return { proposal, unplaceable, totScore:proposal.reduce((s,e)=>s+e.score,0), jobsN:jobs.length };
}
function openOptimalAssign(){
  const r=assignOptimal(); App._optimal=r;
  if(!r.proposal.length){ openModal(`${modalHead("Assegnazione ottima")}<p style="font-size:14px;color:var(--ink-soft);line-height:1.5">Nessuna assegnazione proponibile: le commesse con accettazioni non hanno fornitori con <b>capacità sufficiente</b> nel mese di rientro. Aumenta la capacità o assegna a mano.</p><div class="btn-row"><button class="btn ghost" data-act="closeModal">Chiudi</button></div>`); return; }

  const unp=r.unplaceable.length? `<p class="muted" style="font-size:12.5px;margin-top:10px">${icon("bolt","sm")} ${r.unplaceable.length} ${r.unplaceable.length===1?'commessa resta':'commesse restano'} da assegnare a mano (nessun fornitore con capacità nel mese).</p>`:"";

  if(!d){ d={tipo, scadenza:null, stato:"valido", caricatoIl:todayISO(), nota:""}; s.docs.push(d); }
  Object.assign(d, patch); return d; }

const DOC_VIS = { fornitore:"Righi e il fornitore", righi:"Solo Righi" };
// Fotografia della qualifica: serve a raccontare l'effetto reale di una modifica.
function fotoQualifica(){ const m={}; STATE.suppliers.forEach(s=>{ m[s.id]=qualifica(s.id).stato; }); return m; }
function diffQualifica(prima){ const dopo=fotoQualifica(); let sbloccati=0, bloccati=0, altri=0;
  Object.keys(dopo).forEach(id=>{ if(prima[id]===dopo[id]) return;
    if(prima[id]==="non_qualificato" && dopo[id]!=="non_qualificato") sbloccati++;
    else if(prima[id]!=="non_qualificato" && dopo[id]==="non_qualificato") bloccati++;
    else altri++; });
  return { sbloccati, bloccati, altri, totale:sbloccati+bloccati+altri }; }
function frasiDiff(d){ const p=[];
  if(d.sbloccati) p.push(d.sbloccati+" tornano assegnabili");
  if(d.bloccati)  p.push(d.bloccati+" diventano non assegnabili");
  if(d.altri)     p.push(d.altri+" cambiano riserva");
  return p.join(" · "); }

  const prima=fotoQualifica();
  let t;
  if(id){ t=docTipo(id); if(!t){ toast("Tipo di documento non trovato","warn"); return; } Object.assign(t, patch); }
  else { t=Object.assign({id:nuovoDocTipoId(label), attivo:true}, patch); STATE.docTipi.push(t); }
  const d=diffQualifica(prima);
  persist(); Sfx.play(d.bloccati?"avviso":"approvazione");
  toast((id?"Tipo aggiornato":"Tipo creato")+": "+label
    + (corretto?" · facoltativo, quindi non bloccante":"")
    + (d.totale?" · "+frasiDiff(d):""), d.bloccati?"warn":"ok");
  render(); openDocTypes();
}

// Disattivare non e' eliminare: il tipo esce dalla qualifica ma i documenti
// gia' registrati restano, e riattivandolo tornano a contare.
function doDocTypeToggle(id){ const u=currentUser();
  if(!canDocs(u)){ toast("Riservato al responsabile QHSE e al responsabile di produzione","warn"); return; }
  const t=docTipo(id); if(!t){ toast("Tipo di documento non trovato","warn"); return; }
  const prima=fotoQualifica();
  t.attivo = t.attivo===false;
  const d=diffQualifica(prima);
  persist(); Sfx.play(d.bloccati?"avviso":"tocco");
  toast(t.label+(t.attivo?" riattivato":" non più in uso")+(d.totale?" · "+frasiDiff(d):""), d.bloccati?"warn":"ok");
  render(); openDocTypes();
}

function doDocTypeDelete(id){ const u=currentUser();
  if(!canDocs(u)){ toast("Riservato al responsabile QHSE e al responsabile di produzione","warn"); return; }
  const t=docTipo(id); if(!t){ toast("Tipo di documento non trovato","warn"); return; }
  // se qualcuno lo ha gia' consegnato, eliminarlo cancellerebbe uno storico:
  // in quel caso si disattiva, non si elimina
  if(docTipoUsato(id)){ toast("Ci sono documenti registrati di questo tipo: puoi solo disattivarlo","warn"); return; }
  const prima=fotoQualifica();
  STATE.docTipi = STATE.docTipi.filter(x=>x.id!==id);
  const d=diffQualifica(prima);
  persist(); Sfx.play("tocco");
  toast("Tipo eliminato: "+t.label+(d.totale?" · "+frasiDiff(d):""),"ok");
  render(); openDocTypes();
}
// Chiude la pratica: stato finale, dalla consegna all'archivio.
function closeJob(jid){ if(vietatoQhse()) return; const j=byId(STATE.jobs,jid); const u=currentUser();
  if(!j||j.stato!=="consegnato"||!u||u.role!=="righi") return;
  j.stato="chiuso"; j.chiusaAt=todayISO(); j.chiusaDa=u.id;
  persist(); closeModal(); Sfx.play("completato"); toast("Pratica chiusa e archiviata","ok"); render();
}
function setStato(jid,st){ if(vietatoQhse()) return; const j=byId(STATE.jobs,jid); j.stato=st; if(st==="consegnato"&&!j.dataRientroEff) j.dataRientroEff=todayISO();
  persist(); closeModal(); Sfx.play(st==="consegnato"||st==="chiuso"?"completato":"tocco"); toast("Stato aggiornato: "+STATI[st].label,"ok"); render(); }
function setAvanzamento(jid, step){ const u=currentUser(); const j=byId(STATE.jobs,jid); if(!j||!u.supplierId||j.assegnatoA!==u.supplierId) return;
  j.avanzamento=step; j.avanzamentoAt=new Date().toISOString().slice(0,16); j.avanzamentoBy=u.id;
  // il primo avanzamento segna l'avvio della produzione: la commessa passa "in corso"
  // (cosi' decade anche l'alert di "inizio in ritardo", che vale solo per chi non ha ancora iniziato)
  if(j.stato==="assegnato"){ j.stato="in_corso"; notifyCapoJob(j,"Produzione avviata: "+j.title,"bolt"); }
  STATE.responses.push({id:uid("r"),jobId:jid,supplierId:u.supplierId,tipo:"avanzamento",testo:AVANZAMENTO[step].label,at:j.avanzamentoAt,from:"fornitore",read:false});
  persist(); closeModal(); Sfx.play("avanzamento"); toast("Avanzamento: "+AVANZAMENTO[step].label,"ok"); render();
}
function reqStato(rid,st){ if(vietatoQhse()) return; const r=byId(STATE.requests,rid); r.stato=st; r.read=true; persist(); closeModal();
  Sfx.play(st==="chiusa"?"approvazione":"tocco"); toast(st==="chiusa"?"Richiesta risolta":"Presa in carico","ok"); render(); }

/* aggiorna solo il contenitore risultati (mantiene focus sulla ricerca) */
function updateResults(){ const el=$("#lav-results"); if(!el) return; const u=currentUser();
  if(u.role==="righi"){ el.innerHTML = (App.lavoriMode==="board")?boardHtml():tableHtml(); }
  else if(App.tab==="bacheca"){ let jobs=jobsForSupplier(u.supplierId).filter(j=>j.stato==="pubblicato"&&j.assegnatoA!==u.supplierId&&!jobResponses(j.id).some(r=>r.supplierId===u.supplierId&&r.tipo==="accettazione"));
      const q=(App.fFilters.q||"").toLowerCase(); if(q) jobs=jobs.filter(j=>(j.title+" "+j.code+" "+j.settore).toLowerCase().includes(q));
      el.innerHTML = jobs.length?`<div class="grid auto">${jobs.map(j=>supplierJobCard(j,u)).join("")}</div>`:`<div class="empty">${icon("inbox")}<p>Nessuna proposta</p></div>`; }
  else if(App.tab==="miei"){ render(); }
}

// ricerca istantanea (senza perdere il focus)
document.addEventListener("input",e=>{
  if(e.target && e.target.id==="lav-search"){ App.filters.q=e.target.value; App.page=1; updateResults(); }
  if(e.target && e.target.id==="forn-search"){ App.fFilters.q=e.target.value; updateResults(); }
  if(e.target && e.target.id==="scad-q"){ App.scadQ=e.target.value; const el=$("#scad-list"); if(el) el.innerHTML=scadListaHtml(); }
  // Sync dei campi "Nuovo lavoro" nella bozza: così un re-render (visibilità,
  // fornitori suggeriti) non perde ciò che è stato digitato.
  const NLF={"nl-title":"title","nl-budget":"budget","nl-ore":"ore","nl-desc":"descrizione","nl-inizio":"dataInizioStimata","nl-rientro":"dataRientro","nl-cons":"dataConsegna"};
  if(e.target && NLF[e.target.id]){ App.draft=App.draft||{}; App.draft[NLF[e.target.id]]=e.target.value; }
});
// select filtri avanzati
document.addEventListener("change",e=>{
  if(e.target && e.target.dataset && e.target.dataset.adv){ App.filters[e.target.dataset.adv]=e.target.value; App.page=1; render(); return; }
  if(e.target && e.target.dataset && e.target.dataset.profUser){ setProfilo(e.target.dataset.profUser, e.target.value); return; }
  if(e.target && e.target.id==="nl-capo"){ App.draft=App.draft||{}; App.draft.capoId=e.target.value; return; }
  if(e.target && e.target.id==="nl-ingombro"){ App.draft=App.draft||{}; App.draft.ingombro=e.target.value; return; }
  if(e.target && e.target.id==="nl-import"){ const f=e.target.files[0]; if(!f) return;
    if(/\.(xlsx|xls)$/i.test(f.name)){ toast("Salva il file Excel come CSV, poi ricaricalo","warn"); e.target.value=""; return; }
    const rd=new FileReader(); rd.onload=()=>importJobsCSV(String(rd.result)); rd.onerror=()=>toast("Lettura file non riuscita","warn"); rd.readAsText(f); e.target.value=""; return; }
  if(e.target && e.target.id==="qr-foto"){ const f=e.target.files[0]; if(!f) return; App.qr=App.qr||{};
    const rd=new FileReader(); rd.onload=()=>{ App.qr.foto=rd.result; const p=$("#qr-foto-prev"); if(p) p.innerHTML=`<div class="attach"><span class="fi">${icon("doc")}</span><span class="gr"><b>Foto allegata</b><span>tocca "Invia" per inoltrarla</span></span><img src="${rd.result}" style="width:46px;height:46px;object-fit:cover;border-radius:8px"></div>`; }; rd.readAsDataURL(f); e.target.value=""; return; }
  if(e.target && e.target.id==="nl-file"){
    App.draft=App.draft||{allegati:[]}; App.draft.allegati=App.draft.allegati||[];
    const files=[...e.target.files]; let pend=files.length;
    files.forEach((f,idx)=>{
      const isLayout=(App.draft.allegati.length===0 && idx===0) || /layout/i.test(f.name);
      const a={id:uid("a"),name:f.name,type:f.type||f.name.split(".").pop(),size:(f.size>1024?Math.round(f.size/1024)+" KB":f.size+" B"),layout:isLayout};
      if(f.size<600000 && /image|pdf/.test(f.type)){ const rd=new FileReader(); rd.onload=()=>{ a.dataUrl=rd.result; App.draft.allegati.push(a); if(--pend===0) render(); }; rd.readAsDataURL(f); }
      else { App.draft.allegati.push(a); if(--pend===0) render(); }
    });
  }
});

/* ri-render al cambio di breakpoint mobile/desktop (tabella <-> schede) */
let _narrow = isNarrow(), _rzt=null;
window.addEventListener("resize",()=>{ clearTimeout(_rzt); _rzt=setTimeout(()=>{ const n=isNarrow(); if(n!==_narrow){ _narrow=n; if(currentUser()) render(); } },200); });

/* ============================ Boot ============================ */
resolveMagicLink();   // #f=<fornitore>&c=<commessa>: autentica il fornitore dal link email
render();
openDeepLinkTarget(); // apre la commessa/richiesta indicata dal link
// l'hash puo' comparire dopo il boot (host che impostano l'URL dell'iframe in un secondo momento)
window.addEventListener("hashchange", onMagicHash);
setTimeout(onMagicHash, 60); setTimeout(onMagicHash, 400);

</script>
