<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C5A63">
<meta name="description" content="Portale Fornitori Righi — pubblicazione, assegnazione e gestione dei lavori di subappalto (cablaggio e costruzione quadri elettrici).">
<title>Portale Fornitori · Righi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.svg">
<style>
/* ===================================================================
   Portale Fornitori Righi — Design system (industriale petrol/grafite)
   Nessun font/asset esterno: offline-first, CSP-friendly.
   =================================================================== */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --surface-3:#EAEFF1;
  --ink:#15242B; --ink-soft:#54646E; --muted:#7C8A93;
  --brand:#0C5A63; --brand-deep:#083D44; --brand-tint:#E1EDED; --brand-line:#BFDBDB;
  --accent:#E07B27; --accent-deep:#C4661A; --accent-tint:#FCEBDB;
  --line:#DBE2E6; --line-soft:#E9EEF1;
  --ok:#2E7D53; --ok-tint:#E4F1EA;
  --warn:#B4791A; --warn-tint:#F7EEDA;
  --danger:#C0392B; --danger-tint:#F7E4E1;
  --info:#2A6BB0; --info-tint:#E4EEF8;
  --shadow:0 1px 2px rgba(16,40,48,.06), 0 6px 20px rgba(16,40,48,.06);
  --shadow-lg:0 12px 40px rgba(8,40,44,.22);
  --r:12px; --r-sm:9px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:var(--bg); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:650;line-height:1.15;letter-spacing:-.01em}
a{color:var(--brand)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.soft{color:var(--ink-soft)}
.center{text-align:center}
.hide{display:none !important}

/* ---- Layout ---- */
#app{min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:40;color:#EAF6F6;
  background:linear-gradient(180deg,#0e646d 0%,var(--brand-deep) 100%);
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px);
  display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:30px;height:30px;flex:0 0 auto}
.brand .bt{min-width:0}
.brand .bt b{display:block;font-size:15px;font-weight:650;line-height:1.1;white-space:nowrap}
.brand .bt span{display:block;font-size:11px;opacity:.75;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-spacer{flex:1}
.tb-btn{border:1px solid rgba(234,246,246,.28);background:rgba(234,246,246,.08);color:#EAF6F6;border-radius:10px;min-height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;position:relative}
.tb-btn:hover{background:rgba(234,246,246,.16)}
.tb-btn .badge{position:absolute;top:-5px;right:-5px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--brand-deep)}
.role-chip{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.role-chip.righi{background:var(--accent-tint);color:var(--accent-deep)}
.role-chip.fornitore{background:var(--brand-tint);color:var(--brand-deep)}

nav.tabs{
  position:sticky;top:60px;z-index:35;display:flex;gap:2px;overflow-x:auto;
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:6px calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--ink-soft);padding:8px 13px;border-radius:9px;font-size:13.5px;min-height:40px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
nav.tabs button[aria-selected="true"]{background:var(--brand-tint);color:var(--brand-deep);font-weight:600}
nav.tabs button .cnt{background:var(--surface-3);color:var(--ink-soft);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
nav.tabs button[aria-selected="true"] .cnt{background:#fff;color:var(--brand)}
nav.tabs button .cnt.hot{background:var(--accent);color:#fff}

main{max-width:1060px;margin:0 auto;padding:16px calc(var(--sar) + 14px) calc(var(--sab) + 40px) calc(var(--sal) + 14px)}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px}
.view-head h2{font-size:21px}
.view-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* ---- Cards / grid ---- */
.grid{display:grid;gap:12px}
.grid.k2{grid-template-columns:1fr 1fr}
.grid.k3{grid-template-columns:repeat(3,1fr)}
.grid.k4{grid-template-columns:repeat(4,1fr)}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.kpi{display:flex;flex-direction:column;gap:3px}
.kpi .v{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.accent .v{color:var(--accent-deep)}
.kpi.danger .v{color:var(--danger)}
.kpi.ok .v{color:var(--ok)}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---- Pills / badges ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;font-weight:500}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-tint);color:#256844;border-color:#bfe0cd}
.pill.warn{background:var(--warn-tint);color:#7a5410;border-color:#e6d3a6}
.pill.danger{background:var(--danger-tint);color:#932a20;border-color:#eec4bd}
.pill.info{background:var(--info-tint);color:#1e4f85;border-color:#bcd4ee}
.pill.brand{background:var(--brand-tint);color:var(--brand-deep);border-color:var(--brand-line)}
.pill.accent{background:var(--accent-tint);color:var(--accent-deep);border-color:#f0cfac}
.pill.plain{background:var(--surface);border-color:var(--line)}
.pill.lg{font-size:12.5px;padding:5px 11px}
.tags{display:flex;flex-wrap:wrap;gap:5px}

/* ---- Buttons ---- */
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;padding:10px 15px;border-radius:10px;min-height:42px;font-size:14px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s,transform .05s;box-shadow:0 1px 2px rgba(12,90,99,.18)}
.btn:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn:active{transform:translateY(1px)}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--surface);color:var(--danger);border-color:#e6c2bd;box-shadow:none}
.btn.danger:hover{background:var(--danger-tint)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

/* ---- Forms ---- */
.field{margin-bottom:13px}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* chip-select: input rapido senza digitare */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:8px 13px;font-size:13px;min-height:40px;display:inline-flex;align-items:center;gap:7px;transition:all .12s;font-weight:500}
.chip .ci{font-size:15px;line-height:1}
.chip:hover{border-color:var(--brand-line)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on.accent{background:var(--accent);border-color:var(--accent)}
.chip.multi.on{background:var(--brand-tint);border-color:var(--brand-line);color:var(--brand-deep)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:8px 14px;font-size:13px;color:var(--ink-soft);min-height:40px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}

/* ---- Job cards ---- */
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.job .body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.job .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job .code{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.job h3{font-size:16px;margin-top:2px}
.job .meta{display:flex;flex-wrap:wrap;gap:5px}
.job .info{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-soft)}
.job .info b{color:var(--ink);font-weight:600}
.job .foot{border-top:1px solid var(--line-soft);padding:10px 14px;display:flex;align-items:center;gap:8px;background:var(--surface-2);flex-wrap:wrap}
.job .foot .btn-row{margin-left:auto}
.leftbar{border-left:4px solid var(--brand)}
.leftbar.pub{border-left-color:var(--info)}
.leftbar.ass{border-left-color:var(--ok)}
.leftbar.late{border-left-color:var(--danger)}
.leftbar.draft{border-left-color:var(--muted)}
.leftbar.done{border-left-color:var(--brand)}

/* Kanban board */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:230px}
.col > .h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;padding:2px 2px 0}
.col > .h .n{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px}
.mini{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .06s,box-shadow .15s}
.mini:hover{box-shadow:0 4px 14px rgba(16,40,48,.12)}
.mini.late{border-left-color:var(--danger)}
.mini .t{font-weight:600;font-size:13.5px;margin:2px 0 6px}
.mini .code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.mini .r{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink-soft)}

/* list rows */
.rowlist{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line-soft)}
.lrow:last-child{border-bottom:none}
.lrow .ic{width:38px;height:38px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--brand-tint)}
.lrow .ic.accent{background:var(--accent-tint)}
.lrow .ic.danger{background:var(--danger-tint)}
.lrow .ic.ok{background:var(--ok-tint)}
.lrow .gr{flex:1;min-width:0}
.lrow .gr b{font-weight:600;font-size:14px}
.lrow .gr .s{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}
.lrow.unread{background:linear-gradient(90deg,var(--accent-tint),transparent 40%)}

.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:var(--brand)}
.avatar.sm{width:26px;height:26px;font-size:11px}

/* ---- Empty state ---- */
.empty{text-align:center;padding:38px 16px;color:var(--muted)}
.empty .em{font-size:34px;opacity:.5}
.empty p{margin:8px 0 0}

/* ---- Modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(8,32,36,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
@media(min-width:641px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;box-shadow:var(--shadow-lg);padding:18px calc(var(--sar) + 18px) calc(var(--sab) + 20px) calc(var(--sal) + 18px)}
@media(min-width:641px){.modal{border-radius:16px;max-height:88dvh}}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.modal-h h3{font-size:19px}
.modal-h .x{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:9px;font-size:18px;color:var(--ink-soft);flex:0 0 auto}
.dl{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
.dl .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.dl .v{font-size:14.5px;font-weight:500}
.divide{height:1px;background:var(--line-soft);margin:14px 0}
.sect-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}

/* thread */
.thread{display:flex;flex-direction:column;gap:9px;margin:6px 0}
.msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45}
.msg .who{font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.msg .t{font-size:10.5px;opacity:.55;margin-top:3px;text-align:right}
.msg.them{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.msg.us{align-self:flex-end;background:var(--brand-tint);border:1px solid var(--brand-line)}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center;max-width:100%}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1}
.toast.ok{background:var(--ok)}
.toast.warn{background:var(--accent-deep)}

/* attach */
.attach{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13px}
.attach .fi{width:30px;height:30px;border-radius:7px;background:var(--brand-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.attach .gr{flex:1;min-width:0}
.attach .gr b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attach .gr span{font-size:11px;color:var(--muted)}
.attach.layout{border-color:var(--accent);background:var(--accent-tint)}
.attach.layout .fi{background:#fff;color:var(--accent-deep)}

/* ---- Login ---- */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1100px 620px at 50% -8%,#0e6a74 0,var(--brand-deep) 46%,#062f35 100%);color:#EAF6F6}
.login .box{width:100%;max-width:440px}
.login .logo{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:22px}
.login .logo img{width:64px;height:64px}
.login h1{font-size:25px}
.login .logo p{margin:4px 0 0;opacity:.8;font-size:13.5px;max-width:340px}
.login .panel{background:rgba(255,255,255,.06);border:1px solid rgba(234,246,246,.18);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.login .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin:4px 4px 8px}
.urow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid rgba(234,246,246,.18);background:rgba(255,255,255,.04);color:#EAF6F6;margin-bottom:8px;transition:background .12s,border-color .12s}
.urow:hover{background:rgba(255,255,255,.11);border-color:rgba(234,246,246,.4)}
.urow .gr{flex:1;min-width:0}
.urow .gr b{display:block;font-size:14.5px}
.urow .gr span{font-size:12px;opacity:.7}
.urow .arw{opacity:.5;font-size:18px}
.login .foot{text-align:center;font-size:12px;opacity:.6;margin-top:16px}

@media(max-width:720px){
  .grid.k4{grid-template-columns:1fr 1fr}
  .grid.k3{grid-template-columns:1fr 1fr}
  .brand .bt span{display:none}
}
@media(max-width:520px){
  .grid.k2,.grid.k3,.grid.k4{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .tb-btn span.lbl{display:none}
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="modal-host"></div>
<div id="toast" class="toast" role="status"></div>

<script>
"use strict";
/* ============================ Utility ============================ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||"id")+"_"+Math.random().toString(36).slice(2,9);
const todayISO = ()=> new Date().toISOString().slice(0,10);
function dISO(off){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+(off||0)); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
function fmtDateShort(iso){ if(!iso) return "—"; const [,m,d]=iso.split("-"); return d+"/"+m; }
const eur = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function fmtMoney(n){ return (n==null||n==="")?"—":eur.format(Number(n)); }
function daysTo(iso){ if(!iso) return null; const a=new Date(iso+"T12:00:00"), b=new Date(todayISO()+"T12:00:00"); return Math.round((a-b)/86400000); }
function relDays(iso){ const n=daysTo(iso); if(n==null) return ""; if(n===0) return "oggi"; if(n===1) return "domani"; if(n===-1) return "ieri"; return n>0?("tra "+n+" gg"):(Math.abs(n)+" gg fa"); }
function initials(name){ return String(name||"?").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase(); }
function colorFor(id){ const c=["#0C5A63","#2A6BB0","#8A5A2B","#5E8C5A","#7A5AA8","#C0392B","#127C71"]; let h=0; for(const ch of String(id)) h=(h*31+ch.charCodeAt(0))>>>0; return c[h%c.length]; }

/* ============================ Storage ============================ */
// Feature detection (non user-agent): window.storage (Claude.ai) → localStorage → RAM.
const KEY="righi_portale_v1", SESSKEY="righi_portale_sess_v1";
function makeLocalAdapter(){ return {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
}; }
function makeMemAdapter(){ const m={}; return { get:k=>k in m?m[k]:null, set:(k,v)=>{m[k]=v;} }; }
const Storage = (function(){
  try{ if(typeof window!=="undefined" && window.storage && window.storage.getItem) return {
    get:k=>{ try{return window.storage.getItem(k);}catch(e){return null;} },
    set:(k,v)=>{ try{window.storage.setItem(k,v);}catch(e){} } }; }catch(e){}
  try{ if(typeof localStorage!=="undefined"){ const p="__probe__"; localStorage.setItem(p,"1"); localStorage.removeItem(p); return makeLocalAdapter(); } }catch(e){}
  return makeMemAdapter();
})();
const Store={
  load(){ try{ const r=Storage.get(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } },
  save(state){ try{ Storage.set(KEY, JSON.stringify(state)); }catch(e){} Sync.notify&&Sync.notify(); },
};

/* ===================== Sync seam (RemoteAdapter) =====================
   Contratto dormiente finché non si chiama Sync.enable(remote).
   Il backend reale (vedi BACKEND.md) implementa lo stesso pull()/push(). */
const Sync=(function(){
  let remote=null, base=0, timer=null;
  return {
    enable(r){ remote=r; base=0; },
    async pull(){ if(!remote) return null; const res=await remote.pull(); if(res){ base=res.version; return JSON.parse(res.data); } return null; },
    notify(){ if(!remote) return; clearTimeout(timer); timer=setTimeout(()=>Sync.push(),600); },
    async push(){ if(!remote) return; const res=await remote.push(base, JSON.stringify(STATE)); if(res&&res.ok) base=res.version; return res; },
  };
})();
// Reference in-memory remote (contratto per i test / futuro Supabase)
function makeMemoryRemote(){ let version=0, data=null; return {
  async pull(){ return data==null?null:{version,data}; },
  async push(baseV,payload){ if(baseV!==version) return {conflict:true,version,data}; version++; data=payload; return {ok:true,version}; },
}; }

function hotTab(tab){ return (tab==="richieste"&&countOpenReq()>0); }
function viewFor(u){
  const t=App.tab;
  if(u.role==="righi"){
    if(t==="dashboard") return viewRighiDashboard();
    if(t==="lavori")    return viewRighiLavori();
    if(t==="nuovo")     return viewNuovoLavoro();
    if(t==="richieste") return viewRighiRichieste();
    if(t==="fornitori") return viewFornitori();
  } else {
    if(t==="bacheca")   return viewBacheca(u);
    if(t==="miei")      return viewMiei(u);
    if(t==="richieste") return viewRichiesteGuidate(u);
    if(t==="profilo")   return viewProfilo(u);
  }
  return "";
}

/* counts */
function countRighiLavori(){ return STATE.jobs.filter(j=>j.stato!=="chiuso").length; }
function countOpenReq(){ return STATE.requests.filter(r=>r.stato==="aperta").length; }
function countBacheca(){ const u=currentUser(); if(!u.supplierId) return ""; return jobsForSupplier(u.supplierId).filter(j=>["pubblicato"].includes(j.stato) && j.assegnatoA!==u.supplierId).length; }
function countMiei(){ const u=currentUser(); if(!u.supplierId) return ""; return STATE.jobs.filter(j=>j.assegnatoA===u.supplierId).length; }
function unreadFor(u){
  if(u.role==="righi") return STATE.responses.filter(r=>r.from==="fornitore"&&!r.read).length + STATE.requests.filter(r=>r.from==="fornitore"&&!r.read).length;
  return STATE.notifications.filter(n=>n.toUser===u.id&&!n.read).length;
}

function attRow(a,removable){ return `<div class="attach ${a.layout?'layout':''}"><span class="fi">${a.layout?'📐':fileIcon(a)}</span><span class="gr"><b>${esc(a.name)}</b><span>${a.layout?'Layout':(a.size||a.type||'file')}</span></span>${removable?`<button class="btn sm danger" data-act="rmAtt" data-id="${a.id}">×</button>`:""}</div>`; }
function fileIcon(a){ const t=(a.type||a.name||"").toLowerCase(); if(t.includes("pdf"))return "📄"; if(t.includes("xls")||t.includes("sheet"))return "📊"; if(t.includes("image")||/\.(png|jpg|jpeg)/.test(t))return "🖼"; if(t.includes("dwg")||t.includes("dxf"))return "📐"; return "📎"; }

/* ============================ MODALS ============================ */
function openModal(html){ $("#modal-host").innerHTML=`<div class="modal-bg" data-close-bg><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $("#modal-host").innerHTML=""; }
function modalHead(title){ return `<div class="modal-h"><h3>${title}</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></div>`; }

function openJobModal(jid){
  const u=currentUser(); const j=byId(STATE.jobs,jid); if(!j) return;
  const t=TIPOLOGIE[j.tipologia], st=STATI[j.stato], c=capo(j.capoId), s=supplier(j.assegnatoA), late=isLate(j);
  const isRighi=u.role==="righi";
  const layout=(j.allegati||[]).find(a=>a.layout);
  const others=(j.allegati||[]).filter(a=>!a.layout);
  const resp=jobResponses(j.id);
  const reqs=jobRequests(j.id);
  // mark responses read for Righi
  if(isRighi){ resp.forEach(r=>{ if(r.from==="fornitore") r.read=true; }); }
  let footer="";
  if(isRighi){
    if(j.stato==="bozza") footer=`<button class="btn accent block" data-act="publish" data-job="${j.id}">🚀 Pubblica lavoro</button>`;
    else if(j.stato==="pubblicato"){
      const cand=resp.filter(r=>r.tipo==="accettazione");
      footer=`<div class="btn-row"><button class="btn ghost" data-act="notifyPick" data-job="${j.id}">🔔 Notifica fornitori</button>
        ${cand.length?`<button class="btn accent" data-act="assignPick" data-job="${j.id}">✅ Assegna (${cand.length})</button>`:`<span class="pill plain" style="align-self:center">In attesa di accettazioni</span>`}</div>`;
    } else if(["assegnato","in_corso"].includes(j.stato)){
      footer=`<div class="btn-row"><button class="btn ghost" data-act="notifyPick" data-job="${j.id}">🔔 Notifica</button><button class="btn" data-act="setStato" data-job="${j.id}" data-s="consegnato">Segna consegnato</button></div>`;
    }
  } else {
    const mine=resp.filter(r=>r.supplierId===u.supplierId);
    const accepted=mine.some(r=>r.tipo==="accettazione");
    if(j.stato==="pubblicato"&&!accepted) footer=`<div class="btn-row"><button class="btn ghost" data-act="ask" data-job="${j.id}">❓ Fai una domanda</button><button class="btn accent" data-act="accept" data-job="${j.id}">✅ Accetta proposta</button></div>`;
    else if(j.assegnatoA===u.supplierId) footer=`<button class="btn accent block" data-act="quickReq" data-job="${j.id}">📨 Contatta il caposquadra</button>`;
    else if(accepted) footer=`<span class="pill ok lg">✅ Proposta inviata — in attesa di Righi</span>`;
  }
  const thread = resp.filter(r=>isRighi||r.supplierId===u.supplierId);
  openModal(`${modalHead(esc(j.title))}
    <div class="tags" style="margin-bottom:12px"><span class="pill ${late?'danger':st.pill}">${late?'In ritardo':st.label}</span><span class="pill brand">${t.icon} ${t.label}</span><span class="pill plain">${esc(j.settore)}</span><span class="mono muted" style="align-self:center;font-size:11px">${esc(j.code)}</span></div>
    <div class="row2">
      <div class="dl"><span class="k">Budget indicativo</span><span class="v">${fmtMoney(j.budget)}</span></div>
      <div class="dl"><span class="k">Consegna</span><span class="v">${fmtDate(j.dataConsegna)} <span class="soft" style="font-weight:400">(${relDays(j.dataConsegna)})</span></span></div>
      <div class="dl"><span class="k">Data richiesta</span><span class="v">${fmtDate(j.dataRichiesta)}</span></div>
      <div class="dl"><span class="k">Caposquadra</span><span class="v">${c?esc(c.name):'—'}</span></div>
      <div class="dl"><span class="k">Carpenteria</span><span class="v">${CARPENTERIA[j.carpenteria].label}</span></div>
      <div class="dl"><span class="k">${isRighi?'Visibilità':'Assegnato a'}</span><span class="v">${isRighi?(j.visibility==='tutti'?'Tutti i fornitori':(j.invitati||[]).length+' selezionati'):(s?esc(s.name):'—')}</span></div>
    </div>
    ${j.descrizione?`<div class="dl"><span class="k">Note tecniche</span><span class="v" style="font-weight:400;line-height:1.5">${esc(j.descrizione)}</span></div>`:""}
    ${layout?`<div class="attach layout" style="margin:4px 0 8px" data-act="openAtt" data-att="${layout.id}" data-job="${j.id}"><span class="fi">📐</span><span class="gr"><b>${esc(layout.name)}</b><span>Layout per quotazione · ${esc(layout.size||'')}</span></span><span class="btn sm ghost">Apri</span></div>`:""}
    ${others.map(a=>`<div class="attach" style="margin-bottom:6px" data-act="openAtt" data-att="${a.id}" data-job="${j.id}"><span class="fi">${fileIcon(a)}</span><span class="gr"><b>${esc(a.name)}</b><span>${esc(a.size||a.type||'')}</span></span><span class="btn sm ghost">Apri</span></div>`).join("")}
    ${isRighi&&s?`<div class="dl" style="margin-top:8px"><span class="k">Fornitore</span><span class="v">${esc(s.name)} · ${esc(s.citta)}</span></div>`:""}
    ${thread.length?`<div class="divide"></div><div class="sect-t">Conversazione</div><div class="thread">${thread.map(msgHtml).join("")}</div>`:""}
    ${isRighi&&reqs.length?`<div class="divide"></div><div class="sect-t">Richieste sulla commessa</div><div class="rowlist">${reqs.map(reqRow).join("")}</div>`:""}
    ${footer?`<div class="divide"></div>${footer}`:""}`);
  if(isRighi){ persist(); /* letture aggiornate */ }
}
function msgHtml(r){ const s=supplier(r.supplierId); const mineSide=(currentUser().role==="fornitore"); const us = (r.from==="fornitore")===mineSide;
  const who = r.from==="fornitore" ? (s?s.name:"Fornitore") : "Righi";
  const label = r.tipo==="accettazione" ? "✅ Ha accettato"+(r.importo?" — "+fmtMoney(r.importo):"") : r.tipo==="domanda" ? "❓ Domanda" : "";
  return `<div class="msg ${us?'us':'them'}"><div class="who">${esc(who)}${label?" · "+label:""}</div><div>${esc(r.testo)}</div><div class="t">${esc((r.at||'').replace('T',' '))}</div></div>`;
}

/* Modale: accetta proposta */
function openAcceptModal(jid){ const j=byId(STATE.jobs,jid);
  openModal(`${modalHead("Accetta proposta")}
    <p class="muted" style="font-size:13px;margin-top:0">${esc(j.title)} — puoi confermare al budget indicato o proporre il tuo importo.</p>
    <div class="field"><label>Importo proposto (€)</label><input class="inp" id="acc-imp" type="number" inputmode="numeric" value="${j.budget||''}"></div>
    <div class="field"><label>Nota (facoltativa)</label><input class="inp" id="acc-note" placeholder="es. consegna in 15 giorni"></div>
    <button class="btn accent block" data-act="doAccept" data-job="${jid}">✅ Invia accettazione</button>`);
}
/* Modale: domanda */
function openAskModal(jid){ const j=byId(STATE.jobs,jid);
  openModal(`${modalHead("Fai una domanda")}
    <p class="muted" style="font-size:13px;margin-top:0">${esc(j.title)}</p>
    <div class="field"><label>La tua domanda</label><textarea class="inp" id="ask-t" placeholder="es. La distinta è completa?"></textarea></div>
    <button class="btn accent block" data-act="doAsk" data-job="${jid}">Invia domanda</button>`);
}
/* Modale: richiesta guidata */
function openQuickReq(jid){ const j=byId(STATE.jobs,jid), c=capo(j.capoId);
  App.qr={jobId:jid, tipo:null};
  openModal(`${modalHead("Contatta il caposquadra")}
    <div class="dl"><span class="k">Commessa</span><span class="v">${esc(j.title)} · ${esc(j.code)}</span></div>
    <div class="dl"><span class="k">Caposquadra</span><span class="v">👷 ${esc(c?c.name:'—')}${c?` · <a href="tel:${esc((c.tel||'').replace(/\s/g,''))}">${esc(c.tel)}</a>`:''}</span></div>
    <div class="sect-t" style="margin-top:12px">Tipo di richiesta</div>
    <div class="chips" id="qr-types">${Object.entries(REQ_TYPES).map(([k,v])=>`<button class="chip" data-qrtype="${k}"><span class="ci">${v.icon}</span>${v.label}</button>`).join("")}</div>
    <div class="field" style="margin-top:12px"><label>Dettaglio (facoltativo)</label><textarea class="inp" id="qr-note" placeholder="Poche parole bastano…"></textarea></div>
    <button class="btn accent block" data-act="doQuickReq" data-job="${jid}" id="qr-send" disabled>📨 Invia al caposquadra</button>
    <p class="muted center" style="font-size:12px;margin-bottom:0">Il caposquadra riceve una notifica immediata.</p>`);
}
/* Modale: notifica fornitori */
function openNotifyPick(jid){ const j=byId(STATE.jobs,jid);
  const targets = j.visibility==="selezionati" ? STATE.suppliers.filter(s=>(j.invitati||[]).includes(s.id)) : STATE.suppliers;
  App.notifySel = new Set(targets.map(s=>s.id));
  openModal(`${modalHead("Notifica il lavoro")}
    <p class="muted" style="font-size:13px;margin-top:0">Invia una notifica push del lavoro <b>${esc(j.title)}</b> ai fornitori scelti.</p>
    <div class="chips" id="np-list">${STATE.suppliers.map(s=>`<button class="chip multi ${App.notifySel.has(s.id)?'on':''}" data-np="${s.id}">${esc(s.name)}</button>`).join("")}</div>
    <button class="btn accent block" style="margin-top:14px" data-act="doNotify" data-job="${jid}">🔔 Invia notifica</button>`);
}
/* Modale: assegna */
function openAssignPick(jid){ const j=byId(STATE.jobs,jid);
  const cand=jobResponses(j.id).filter(r=>r.tipo==="accettazione");
  openModal(`${modalHead("Assegna la commessa")}
    <p class="muted" style="font-size:13px;margin-top:0">${esc(j.title)} — scegli il fornitore tra chi ha accettato.</p>
    <div class="rowlist">${cand.map(r=>{const s=supplier(r.supplierId);return `<div class="lrow"><span class="avatar sm" style="background:${colorFor(s.id)}">${initials(s.name)}</span>
      <span class="gr"><b>${esc(s.name)}</b><span class="s">${esc(s.citta)} · ⭐ ${s.rating} · offerta ${fmtMoney(r.importo)}</span></span>
      <button class="btn sm accent" data-act="assign" data-job="${jid}" data-sup="${s.id}">Assegna</button></div>`;}).join("")}</div>`);
}
/* Modale: richiesta dettaglio (Righi) */
function openReqDetail(rid){ const r=byId(STATE.requests,rid); if(!r) return; r.read=true; persist();
  const j=byId(STATE.jobs,r.jobId), s=supplier(r.supplierId), c=capo(r.capoId), t=REQ_TYPES[r.tipo];
  openModal(`${modalHead(t.icon+" "+t.label)}
    <div class="dl"><span class="k">Fornitore</span><span class="v">${esc(s?s.name:'')}</span></div>
    <div class="dl"><span class="k">Commessa</span><span class="v">${esc(j?j.title:'')} · ${esc(j?j.code:'')}</span></div>
    <div class="dl"><span class="k">Caposquadra</span><span class="v">👷 ${esc(c?c.name:'—')}</span></div>
    <div class="dl"><span class="k">Ricevuta</span><span class="v">${esc((r.at||'').replace('T',' '))}</span></div>
    ${r.testo?`<div class="msg them" style="max-width:100%;margin:6px 0"><div>${esc(r.testo)}</div></div>`:""}
    <div class="divide"></div>
    <div class="btn-row">${r.stato==="aperta"?`<button class="btn" data-act="reqStato" data-id="${rid}" data-s="presa">Prendi in carico</button>`:""}
      ${r.stato!=="chiusa"?`<button class="btn accent" data-act="reqStato" data-id="${rid}" data-s="chiusa">Segna risolta</button>`:`<span class="pill ok lg">✅ Chiusa</span>`}</div>`);
}
/* Modale: notifiche */
function openNotifCenter(){ const u=currentUser();
  let items;
  if(u.role==="righi"){
    items=[...STATE.responses.filter(r=>r.from==="fornitore").map(r=>({at:r.at,read:r.read,icon:r.tipo==="accettazione"?"✅":"❓",txt:(r.tipo==="accettazione"?"Accettazione":"Domanda")+" — "+(supplier(r.supplierId)||{}).name,sub:(byId(STATE.jobs,r.jobId)||{}).title,job:r.jobId})),
      ...STATE.requests.filter(r=>r.from==="fornitore").map(r=>({at:r.at,read:r.read,icon:REQ_TYPES[r.tipo].icon,txt:REQ_TYPES[r.tipo].label+" — "+(supplier(r.supplierId)||{}).name,sub:(byId(STATE.jobs,r.jobId)||{}).title,req:r.id}))];
  } else {
    items=STATE.notifications.filter(n=>n.toUser===u.id).map(n=>({at:n.at,read:n.read,icon:n.icon||"🔔",txt:n.txt,sub:n.sub,job:n.jobId}));
  }
  items.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  openModal(`${modalHead("🔔 Notifiche")}
    ${items.length?`<div class="rowlist">${items.map(n=>`<div class="lrow ${!n.read?'unread':''}" ${n.job?`data-job="${n.job}"`:n.req?`data-req="${n.req}"`:""} style="cursor:pointer">
      <span class="ic">${n.icon}</span><span class="gr"><b>${esc(n.txt)}</b><span class="s">${esc(n.sub||'')} · ${esc((n.at||'').replace('T',' '))}</span></span></div>`).join("")}</div>`
      :`<div class="empty"><div class="em">🔔</div><p>Nessuna notifica</p></div>`}`);
  // mark read
  if(u.role==="righi"){ STATE.responses.forEach(r=>r.read=true); STATE.requests.forEach(r=>{ if(r.from==="fornitore") r.read=true; }); }
  else STATE.notifications.forEach(n=>{ if(n.toUser===u.id) n.read=true; });
  persist();
}
/* Modale: switch utente */
function openSwitch(){
  openModal(`${modalHead("Cambia utente")}
    <p class="muted" style="font-size:13px;margin-top:0">Passa rapidamente tra i due lati del portale per la demo.</p>
    ${STATE.users.map(u=>{const s=u.supplierId?supplier(u.supplierId):null;const cur=Session&&Session.userId===u.id;
      return `<button class="urow" style="color:var(--ink);background:var(--surface-2);border-color:var(--line)" data-login="${u.id}">
        <span class="avatar" style="background:${u.role==='righi'?'var(--accent)':colorFor(u.id)}">${initials(u.name)}</span>
        <span class="gr"><b>${esc(u.name)} ${cur?'<span class="pill brand" style="margin-left:4px">attuale</span>':''}</b><span class="muted">${u.role==='righi'?esc(u.ruolo):esc(s?s.name:'')}</span></span><span class="arw">›</span></button>`;}).join("")}
    <div class="divide"></div>
    <button class="btn danger block" data-act="logout">Esci</button>`);
}
/* Modale: apri allegato (simulato) */
function openAttachment(jid,aid){ const j=byId(STATE.jobs,jid); const a=(j.allegati||[]).find(x=>x.id===aid); if(!a) return;
  if(a.dataUrl){ const w=window.open(); if(w) w.document.write(`<iframe src="${a.dataUrl}" style="border:0;width:100%;height:100vh"></iframe>`); return; }
  toast("📄 "+a.name+" — anteprima non disponibile nel prototipo","warn");
}

/* ============================ AZIONI ============================ */
function toast(msg,kind){ const t=$("#toast"); t.className="toast show "+(kind||""); t.textContent=msg; clearTimeout(toast._t); toast._t=setTimeout(()=>t.className="toast "+(kind||""),2200); }

function doPublish(jid){ const j=byId(STATE.jobs,jid); if(!j) return; j.stato="pubblicato"; j.publishedAt=todayISO();
  // notifica ai destinatari
  notifyJob(j, j.visibility==="selezionati"?(j.invitati||[]):STATE.suppliers.map(s=>s.id));
  persist(); closeModal(); toast("🚀 Lavoro pubblicato","ok"); render(); }

function notifyJob(j, supplierIds){
  supplierIds.forEach(sid=>{ const usr=STATE.users.find(u=>u.supplierId===sid); if(usr) STATE.notifications.push({id:uid("n"),toUser:usr.id,icon:TIPOLOGIE[j.tipologia].icon,txt:"Nuovo lavoro: "+j.title,sub:j.code+" · "+fmtMoney(j.budget),jobId:j.id,at:new Date().toISOString().slice(0,16),read:false}); });
}

function createJob(mode){
  const d=App.draft;
  d.title=$("#nl-title").value.trim();
  d.budget=$("#nl-budget").value;
  d.capoId=$("#nl-capo").value;
  d.dataRichiesta=$("#nl-req").value;
  d.dataConsegna=$("#nl-cons").value;
  d.descrizione=$("#nl-desc").value.trim();
  if(!d.title){ toast("Inserisci un titolo","warn"); $("#nl-title").focus(); return; }
  if(d.visibility==="selezionati" && !(d.invitati||[]).length){ toast("Scegli almeno un fornitore","warn"); return; }
  const n=STATE.jobs.reduce((m,j)=>Math.max(m,parseInt((j.code||"").split("-")[1])||0),2600);
  const job={ id:uid("j"), code:"RGH-"+(n+1), title:d.title, tipologia:d.tipologia, settore:d.settore, carpenteria:d.carpenteria,
    budget:d.budget?Number(d.budget):null, dataRichiesta:d.dataRichiesta, dataConsegna:d.dataConsegna, capoId:d.capoId,
    descrizione:d.descrizione, allegati:d.allegati||[], visibility:d.visibility, invitati:d.invitati||[],
    stato: mode==="publish"?"pubblicato":"bozza", assegnatoA:null, publishedAt: mode==="publish"?todayISO():null, createdAt:todayISO() };
  STATE.jobs.unshift(job);
  if(mode==="publish") notifyJob(job, job.visibility==="selezionati"?job.invitati:STATE.suppliers.map(s=>s.id));
  App.draft=null; persist();
  toast(mode==="publish"?"🚀 Lavoro pubblicato":"💾 Bozza salvata","ok");
  App.tab="lavori"; render();
}

function doAccept(jid){ const u=currentUser(); const imp=$("#acc-imp").value; const note=$("#acc-note").value.trim();
  STATE.responses.push({id:uid("r"),jobId:jid,supplierId:u.supplierId,tipo:"accettazione",testo:note||"Proposta accettata.",importo:imp?Number(imp):null,at:new Date().toISOString().slice(0,16),from:"fornitore",read:false});
  persist(); closeModal(); toast("✅ Proposta inviata a Righi","ok"); render();
}
function doAsk(jid){ const u=currentUser(); const t=$("#ask-t").value.trim(); if(!t){ toast("Scrivi la domanda","warn"); return; }
  STATE.responses.push({id:uid("r"),jobId:jid,supplierId:u.supplierId,tipo:"domanda",testo:t,at:new Date().toISOString().slice(0,16),from:"fornitore",read:false});
  persist(); closeModal(); toast("Domanda inviata","ok"); render();
}
function doQuickReq(jid){ const u=currentUser(); const j=byId(STATE.jobs,jid); if(!App.qr||!App.qr.tipo){ toast("Scegli il tipo di richiesta","warn"); return; }
  const note=$("#qr-note").value.trim();
  STATE.requests.push({id:uid("q"),jobId:jid,supplierId:u.supplierId,tipo:App.qr.tipo,testo:note,at:new Date().toISOString().slice(0,16),stato:"aperta",capoId:j.capoId,from:"fornitore",read:false});
  App.qr=null; persist(); closeModal(); toast("📨 Richiesta inviata al caposquadra","ok"); render();
}
function doNotify(jid){ const j=byId(STATE.jobs,jid); const ids=[...App.notifySel];
  if(!ids.length){ toast("Scegli almeno un fornitore","warn"); return; }
  notifyJob(j, ids); persist(); closeModal(); toast("🔔 Notifica inviata a "+ids.length+" fornitor"+(ids.length>1?"i":"e"),"ok"); render();
}
function doAssign(jid,sid){ const j=byId(STATE.jobs,jid); const s=supplier(sid); j.assegnatoA=sid; j.stato="assegnato";
  // notifica al fornitore assegnato
  const usr=STATE.users.find(u=>u.supplierId===sid); if(usr) STATE.notifications.push({id:uid("n"),toUser:usr.id,icon:"🎉",txt:"Commessa assegnata: "+j.title,sub:j.code,jobId:j.id,at:new Date().toISOString().slice(0,16),read:false});
  STATE.responses.filter(r=>r.jobId===jid).forEach(r=>r.read=true);
  persist(); closeModal(); toast("✅ Assegnato a "+s.name,"ok"); render();
}
function setStato(jid,st){ const j=byId(STATE.jobs,jid); j.stato=st; persist(); closeModal(); toast("Stato aggiornato: "+STATI[st].label,"ok"); render(); }
function reqStato(rid,st){ const r=byId(STATE.requests,rid); r.stato=st; r.read=true; persist(); closeModal(); toast(st==="chiusa"?"✅ Richiesta risolta":"Presa in carico","ok"); render(); }

/* ============================ Eventi ============================ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-login],[data-tab],[data-job],[data-req],[data-set],[data-toggle],[data-qrtype],[data-np],[data-close-bg],[data-m]");
  if(!el) return;
  // chiusura sfondo modale
  if(el.hasAttribute("data-close-bg") && e.target===el){ closeModal(); return; }

  // login / switch
  if(el.dataset.login){ setSession(el.dataset.login); App.tab=null; closeModal(); render(); return; }

  // tab
  if(el.dataset.tab){ App.tab=el.dataset.tab; render(); window.scrollTo(0,0); return; }

  const act=el.dataset.act;

  // chip-set nel form nuovo lavoro
  if(el.dataset.set){ const g=el.dataset.set; App.draft=App.draft||{}; App.draft[g]=el.dataset.v;
    if(g==="visibility"){ render(); } else { // aggiorna solo il gruppo
      const grp=el.closest(".chips,.seg"); if(grp){ $$("[data-set='"+g+"']",grp.parentElement||document).forEach(b=>b.classList.remove("on")); }
      $$("[data-set='"+g+"'][data-v='"+CSS.escape(el.dataset.v)+"']").forEach(b=>b.classList.add("on")); }
    return; }
  if(el.dataset.toggle==="inv"){ App.draft=App.draft||{invitati:[]}; App.draft.invitati=App.draft.invitati||[];
    const id=el.dataset.v; const i=App.draft.invitati.indexOf(id); if(i<0) App.draft.invitati.push(id); else App.draft.invitati.splice(i,1);
    el.classList.toggle("on"); return; }

  // richiesta guidata: scelta tipo
  if(el.dataset.qrtype){ App.qr=App.qr||{}; App.qr.tipo=el.dataset.qrtype;
    $$("#qr-types .chip").forEach(c=>c.classList.remove("on","accent")); el.classList.add("on","accent");
    const b=$("#qr-send"); if(b) b.disabled=false; return; }
  // notify pick toggle
  if(el.dataset.np){ const id=el.dataset.np; if(App.notifySel.has(id)) App.notifySel.delete(id); else App.notifySel.add(id); el.classList.toggle("on"); return; }

  // apertura dettaglio job / richiesta (righe cliccabili)
  if(el.dataset.job && !act){ openJobModal(el.dataset.job); return; }
  if(el.dataset.req && !act){ openReqDetail(el.dataset.req); return; }

  switch(act){
    case "closeModal": closeModal(); break;
    case "notif": openNotifCenter(); break;
    case "switch": openSwitch(); break;
    case "logout": setSession(null); closeModal(); App.tab=null; render(); break;
    case "goNuovo": App.tab="nuovo"; render(); break;
    case "lavoriMode": App.lavoriMode=el.dataset.m; render(); break;
    case "publish": doPublish(el.dataset.job); break;
    case "createJob": createJob(el.dataset.mode); break;
    case "accept": openAcceptModal(el.dataset.job); break;
    case "doAccept": doAccept(el.dataset.job); break;
    case "ask": openAskModal(el.dataset.job); break;
    case "doAsk": doAsk(el.dataset.job); break;
    case "quickReq": openQuickReq(el.dataset.job); break;
    case "doQuickReq": doQuickReq(el.dataset.job); break;
    case "notifyPick": openNotifyPick(el.dataset.job); break;
    case "doNotify": doNotify(el.dataset.job); break;
    case "assignPick": openAssignPick(el.dataset.job); break;
    case "assign": doAssign(el.dataset.job, el.dataset.sup); break;
    case "setStato": setStato(el.dataset.job, el.dataset.s); break;
    case "reqStato": reqStato(el.dataset.id, el.dataset.s); break;
    case "rmAtt": App.draft.allegati=(App.draft.allegati||[]).filter(a=>a.id!==el.dataset.id); render(); break;
    case "openAtt": openAttachment(el.dataset.job, el.dataset.att); break;
  }
});

// input file allegati (nuovo lavoro)
document.addEventListener("change",e=>{
  if(e.target && e.target.id==="nl-file"){
    App.draft=App.draft||{allegati:[]}; App.draft.allegati=App.draft.allegati||[];
    const files=[...e.target.files]; let pend=files.length;
    files.forEach((f,idx)=>{
      const isLayout = (App.draft.allegati.length===0 && idx===0) || /layout/i.test(f.name);
      const a={id:uid("a"),name:f.name,type:f.type||f.name.split(".").pop(),size:(f.size>1024?Math.round(f.size/1024)+" KB":f.size+" B"),layout:isLayout};
      if(f.size<600000 && /image|pdf/.test(f.type)){ const rd=new FileReader(); rd.onload=()=>{ a.dataUrl=rd.result; App.draft.allegati.push(a); if(--pend===0) render(); }; rd.readAsDataURL(f); }
      else { App.draft.allegati.push(a); if(--pend===0) render(); }
    });
    if(!files.length) return;
  }
});

/* ============================ Boot ============================ */
render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
